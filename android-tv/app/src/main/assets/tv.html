<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X7 项目看板</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:#e5edf8}
    body{font-family:Arial,"Microsoft YaHei",sans-serif}.top{padding:12px 18px;background:#0d192b;border-bottom:1px solid #24334a}
    h1{display:inline-block;margin:0;font-size:24px}.sync{float:right;margin-top:6px;color:#9fb0c8}.ok{color:#62d49b}.error{color:#ff8b8b}
    .summary{display:none;align-items:center;gap:18px;padding:8px 18px;background:#0b1728;border-bottom:1px solid #24334a;color:#b9c8dc;font-size:12px}.summary.show{display:flex}.project-meta{min-width:185px}.project-meta b{display:block;color:#fff;font-size:14px;margin-bottom:3px}.stats{display:flex;gap:13px;flex:1}.stat b{display:block;color:#fff;font-size:16px}.progress{width:210px}.track{height:6px;margin-top:5px;background:#26364d;border-radius:4px;overflow:hidden}.bar{height:100%;background:#3b82f6}.days{min-width:72px;text-align:center}.days b{display:block;color:#62d49b;font-size:20px}
    .board{display:flex;align-items:flex-start;gap:8px;width:100%;padding:10px;overflow:hidden}.phase{flex:1 1 0;min-width:0;background:#0e1b2e;border:1px solid #243650;border-radius:8px;overflow:hidden}
    .head{padding:10px 11px;border-top:4px solid #3b82f6;background:#12223a;font-size:17px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{margin-top:4px;color:#91a4bf;font-size:11px;font-weight:normal}
    .nodes{padding:6px}.node{margin-bottom:6px;padding:8px;background:#14243a;border:1px solid #273a55;border-radius:6px}.name{font-size:14px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{margin-top:5px;color:#98aac2;font-size:10px}.status{display:inline-block;margin-top:5px;padding:2px 6px;border-radius:9px;background:#323b4a;color:#bdc8d8;font-size:10px}
    .completed .status{background:#113b32;color:#68d6ac}.ongoing .status{background:#173b68;color:#82b9ff}.delayed{border-color:#a74747}.delayed .status{background:#552626;color:#ffaaaa}
    .message{margin:60px auto;max-width:760px;padding:30px;text-align:center;border-radius:12px;background:#102039;font-size:20px;line-height:1.7}
  </style>
</head>
<body>
  <div class="top"><h1 id="title">X7 项目看板</h1><span class="sync" id="sync">应用已启动，正在读取数据…</span></div>
  <div class="summary" id="summary"></div>
  <div id="content"><div class="message">正在连接项目服务器…</div></div>
  <script>
  (function(){
    var API='https://x7-kanban-api.xuqian0623.workers.dev';
    var PROJECT='';
    var title=document.getElementById('title'),sync=document.getElementById('sync'),summary=document.getElementById('summary'),content=document.getElementById('content');
    function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function date(v){if(!v)return '--';var d=new Date(v);return isNaN(d.getTime())?'--':('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
    function label(n){return n.delay?'延期':n.status==='completed'?'已完成':n.status==='ongoing'?'进行中':'待开始'}
    function renderSummary(state){
      var phases=state.phases||[],i,j,n,total=0,done=0,doing=0,late=0,pending=0,days='--',launch,pct;
      for(i=0;i<phases.length;i++)for(j=0;j<(phases[i].nodes||[]).length;j++){n=phases[i].nodes[j];total++;if(n.status==='completed')done++;else if(n.delay)late++;else if(n.status==='ongoing')doing++;else pending++}
      pct=total?Math.round(done*100/total):0;launch=new Date(state.launchDate);if(!isNaN(launch.getTime()))days=Math.ceil((launch.getTime()-new Date().getTime())/86400000);
      summary.innerHTML='<div class="project-meta"><b>'+esc(state.projectOwner||'负责人未设置')+'</b>启动：'+date(state.projectStartDate)+'</div><div class="stats"><div class="stat"><b>'+done+'</b>已完成</div><div class="stat"><b>'+doing+'</b>进行中</div><div class="stat"><b>'+late+'</b>已延期</div><div class="stat"><b>'+pending+'</b>待开始</div></div><div class="progress"><b>'+pct+'% &nbsp; '+done+'/'+total+'</b><div class="track"><div class="bar" style="width:'+pct+'%"></div></div></div><div class="days"><b>'+days+'</b>距上市（天）</div>';
      summary.className='summary show';
    }
    function render(state){
      var phases=state.phases||[],html='<div class="board">',i,j,p,n,done;
      title.innerHTML=esc(state.projectName||PROJECT);renderSummary(state);
      for(i=0;i<phases.length;i++){
        p=phases[i];done=0;for(j=0;j<(p.nodes||[]).length;j++)if(p.nodes[j].status==='completed')done++;
        html+='<section class="phase"><div class="head" style="border-top-color:'+esc(p.color||'#3b82f6')+'">'+esc(p.name)+'<div class="count">'+done+' / '+(p.nodes||[]).length+' 已完成</div></div><div class="nodes">';
        for(j=0;j<(p.nodes||[]).length;j++){n=p.nodes[j];html+='<div class="node '+esc(n.status||'pending')+(n.delay?' delayed':'')+'"><div class="name">'+esc(n.name)+'</div><div class="meta">'+date(n.planStart)+' → '+date(n.planEnd)+(n.owner?'　'+esc(n.owner):'')+'</div><span class="status">'+label(n)+'</span></div>'}
        html+='</div></section>';
      }
      content.innerHTML=html+'</div>';setTimeout(fitBoard,0);
    }
    function fitBoard(){
      var board=content.getElementsByClassName('board')[0],phases=content.getElementsByClassName('phase'),i,max=0,available,scale;
      if(!board||!phases.length)return;
      board.style.zoom='1';board.style.width='100%';
      for(i=0;i<phases.length;i++)if(phases[i].offsetHeight>max)max=phases[i].offsetHeight;
      available=document.documentElement.clientHeight-board.offsetTop-12;
      scale=Math.min(1,available/(max+20));scale=Math.max(.55,scale);
      if(scale<1){board.style.width=(100/scale)+'%';board.style.zoom=String(scale)}
    }
    function loadProject(project){
      var xhr=new XMLHttpRequest();sync.className='sync';sync.innerHTML='正在同步…';
      xhr.open('GET',API+'/api/state/'+encodeURIComponent(project)+'?_='+new Date().getTime(),true);xhr.timeout=30000;
      xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{var data=JSON.parse(xhr.responseText);if(!data.state)throw new Error('服务器暂无项目数据');render(data.state);sync.className='sync ok';sync.innerHTML='已更新 '+new Date().toLocaleTimeString()}catch(e){fail(e.message)}}else fail('服务器响应 '+xhr.status)};
      xhr.onerror=function(){fail('网络连接失败')};xhr.ontimeout=function(){fail('连接超时，服务器可能正在唤醒')};xhr.send(null);
    }
    function load(){
      if(PROJECT){loadProject(PROJECT);return}
      var xhr=new XMLHttpRequest();sync.className='sync';sync.innerHTML='正在读取项目…';
      xhr.open('GET',API+'/api/projects?_='+new Date().getTime(),true);xhr.timeout=30000;
      xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{var data=JSON.parse(xhr.responseText),items=data.projects||[];if(!items.length)throw new Error('云端暂无项目');PROJECT=items[0].name;loadProject(PROJECT)}catch(e){fail(e.message)}}else fail('服务器响应 '+xhr.status)};
      xhr.onerror=function(){fail('网络连接失败')};xhr.ontimeout=function(){fail('连接超时')};xhr.send(null);
    }
    function fail(msg){sync.className='sync error';sync.innerHTML='同步失败';if(content.getElementsByClassName('board').length===0)content.innerHTML='<div class="message">应用已正常启动<br>暂时无法读取数据：'+esc(msg)+'<br>15 秒后自动重试</div>'}
    load();setInterval(load,15000);
  }());
  </script>
</body>
</html>
