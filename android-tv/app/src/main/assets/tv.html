<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X7 项目看板</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f9;color:#1e293b}
    body{font-family:Arial,"Microsoft YaHei",sans-serif}.top{margin:8px 10px 0;padding:10px 14px;background:#fff;border:1px solid #d8e1ec;border-bottom:0;border-radius:10px 10px 0 0}
    h1{display:inline-block;margin:0;font-size:23px}.sync{float:right;margin-top:5px;color:#64748b}.ok{color:#059669}.error{color:#dc2626}
    .summary{display:none;align-items:center;gap:22px;margin:0 10px 8px;padding:8px 14px;background:#fff;border:1px solid #d8e1ec;border-top:0;border-radius:0 0 10px 10px;color:#64748b;font-size:11px}.summary.show{display:flex}.project-meta{min-width:180px}.project-meta b{display:block;color:#334155;font-size:13px;margin-bottom:3px}.stats{display:flex;gap:18px;flex:1}.stat b{display:block;color:#0f172a;font-size:17px}.progress{width:220px;color:#334155}.track{height:7px;margin-top:5px;background:#dbe5f1;border-radius:4px;overflow:hidden}.bar{height:100%;background:#3b82f6}.days{min-width:82px;text-align:center}.days b{display:block;color:#10b981;font-size:21px}
    .profile{display:none;margin:0 10px 8px;padding:7px 12px;background:#fff;border:1px solid #d8e1ec;border-radius:8px;color:#64748b;font-size:10px}.profile.show{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}.profile-title{color:#1e293b;font-size:12px;font-weight:bold;flex:none}.profile-item{flex:none;white-space:nowrap}.profile-item b{color:#475569}.profile-empty{color:#94a3b8}
    .board{display:flex;align-items:flex-start;gap:6px;width:100%;padding:0 26px 8px 14px;overflow:hidden}.phase{flex:1 1 0;min-width:0;background:#fff;border:1px solid #d8e1ec;border-radius:8px;overflow:hidden;box-shadow:0 2px 5px rgba(15,23,42,.08)}
    .head{padding:9px 10px;border-top:4px solid #3b82f6;background:#f8fafc;font-size:16px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{margin-top:4px;color:#64748b;font-size:10px;font-weight:normal}
    .nodes{padding:6px}.node{margin-bottom:6px;padding:8px;background:#fff;border:1px solid #dbe3ed;border-radius:7px}.name{font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{margin-top:5px;color:#64748b;font-size:10px}.status{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:9px;background:#e8eef6;color:#64748b;font-size:10px}
    .completed{background:#ecfdf5;border-color:#a7f3d0}.completed .status{background:#d1fae5;color:#059669}.ongoing{background:#eff6ff;border-color:#bfdbfe}.ongoing .status{background:#dbeafe;color:#2563eb}.delayed{background:#fff1f2;border-color:#fda4af}.delayed .status{background:#ffe4e6;color:#dc2626}
    .message{margin:60px auto;max-width:760px;padding:30px;text-align:center;border:1px solid #d8e1ec;border-radius:12px;background:#fff;font-size:20px;line-height:1.7}
  </style>
</head>
<body>
  <div class="top"><h1 id="title">X7 项目看板</h1><span class="sync" id="sync">应用已启动，正在读取数据…（确定键刷新）</span></div>
  <div class="summary" id="summary"></div>
  <div class="profile" id="profile"></div>
  <div id="content"><div class="message">正在连接项目服务器…</div></div>
  <script>
  (function(){
    var API='https://x7-kanban-api.xuqian0623.workers.dev';
    var PROJECT='',LAST='',LAST_KEY_TIME=0;
    var title=document.getElementById('title'),sync=document.getElementById('sync'),summary=document.getElementById('summary'),profile=document.getElementById('profile'),content=document.getElementById('content');
    function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function date(v){if(!v)return '--';var d=new Date(v);return isNaN(d.getTime())?'--':('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
    function overdue(n){if(!n.planEnd||n.status==='completed')return false;var today=new Date(),end=new Date(n.planEnd);today.setHours(0,0,0,0);end.setHours(0,0,0,0);return end<today}
    function label(n){return overdue(n)?'逾期':n.delay?'延期':n.status==='completed'?'已完成':n.status==='ongoing'?'进行中':'待开始'}
    function renderSummary(state){
      var phases=state.phases||[],i,j,n,total=0,done=0,doing=0,late=0,pending=0,days='--',launch,pct;
      for(i=0;i<phases.length;i++)for(j=0;j<(phases[i].nodes||[]).length;j++){n=phases[i].nodes[j];total++;if(n.status==='completed')done++;else if(n.delay||overdue(n))late++;else if(n.status==='ongoing')doing++;else pending++}
      pct=total?Math.round(done*100/total):0;launch=new Date(state.launchDate);if(!isNaN(launch.getTime()))days=Math.ceil((launch.getTime()-new Date().getTime())/86400000);
      summary.innerHTML='<div class="project-meta"><b>'+esc(state.projectOwner||'负责人未设置')+'</b>启动：'+date(state.projectStartDate)+'</div><div class="stats"><div class="stat"><b>'+done+'</b>已完成</div><div class="stat"><b>'+doing+'</b>进行中</div><div class="stat"><b>'+late+'</b>已延期</div><div class="stat"><b>'+pending+'</b>待开始</div></div><div class="progress"><b>'+pct+'% &nbsp; '+done+'/'+total+'</b><div class="track"><div class="bar" style="width:'+pct+'%"></div></div></div><div class="days"><b>'+days+'</b>距上市（天）</div>';
      summary.className='summary show';
    }
    function renderProfile(state){
      var p=state.projectProfile||{},params=String(p.params||'').split(/\r?\n/),selling=String(p.sellingPoints||'').replace(/\s+/g,' '),html='<span class="profile-title">☑ 项目简介</span>',i,paramCount=0;
      for(i=0;i<params.length;i++){params[i]=params[i].replace(/^\s+|\s+$/g,'');if(params[i])paramCount++}
      if(!p.image&&!paramCount&&!selling)html+='<span class="profile-empty">暂未填写；可在电脑端添加产品效果图、基础参数和核心卖点</span>';
      else{if(p.image)html+='<span class="profile-item"><b>产品效果图</b> 已上传</span>';for(i=0;i<params.length;i++)if(params[i])html+='<span class="profile-item">'+esc(params[i])+'</span>';if(selling)html+='<span class="profile-item"><b>核心卖点</b> '+esc(selling)+'</span>'}
      profile.innerHTML=html;profile.className='profile show';
    }
    function render(state){
      var phases=state.phases||[],html='<div class="board">',i,j,p,n,done;
      title.innerHTML=esc(state.projectName||PROJECT);renderSummary(state);renderProfile(state);
      for(i=0;i<phases.length;i++){
        p=phases[i];done=0;for(j=0;j<(p.nodes||[]).length;j++)if(p.nodes[j].status==='completed')done++;
        html+='<section class="phase"><div class="head" style="border-top-color:'+esc(p.color||'#3b82f6')+'">'+esc(p.name)+'<div class="count">'+done+' / '+(p.nodes||[]).length+' 已完成</div></div><div class="nodes">';
        for(j=0;j<(p.nodes||[]).length;j++){n=p.nodes[j];html+='<div class="node '+esc(n.status||'pending')+((n.delay||overdue(n))?' delayed':'')+'"><div class="name">'+esc(n.name)+'</div><div class="meta">'+date(n.planStart)+' → '+date(n.planEnd)+(n.owner?'　'+esc(n.owner):'')+'</div><span class="status">'+label(n)+'</span></div>'}
        html+='</div></section>';
      }
      content.innerHTML=html+'</div>';setTimeout(fitBoard,0);
    }
    function fitBoard(){
      var board=content.getElementsByClassName('board')[0],phases=content.getElementsByClassName('phase'),i,max=0,available,scale;
      if(!board||!phases.length)return;
      board.style.zoom='1';board.style.width='100%';
      for(i=0;i<phases.length;i++)if(phases[i].offsetHeight>max)max=phases[i].offsetHeight;
      available=document.documentElement.clientHeight-board.offsetTop-12;
      scale=Math.min(1,available/(max+20));scale=Math.max(.55,scale);
      if(scale<1){board.style.width='100%';board.style.zoom=String(scale)}
    }
    function loadProject(project){
      var xhr=new XMLHttpRequest();sync.className='sync';sync.innerHTML='正在同步…';
      xhr.open('GET',API+'/api/state/'+encodeURIComponent(project)+'?_='+new Date().getTime(),true);xhr.timeout=30000;
      xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{var data=JSON.parse(xhr.responseText);if(!data.state)throw new Error('服务器暂无项目数据');if(xhr.responseText!==LAST){LAST=xhr.responseText;render(data.state)}sync.className='sync ok';sync.innerHTML='已更新 '+new Date().toLocaleTimeString()+' · 确定键刷新'}catch(e){fail(e.message)}}else fail('服务器响应 '+xhr.status)};
      xhr.onerror=function(){fail('网络连接失败')};xhr.ontimeout=function(){fail('连接超时，服务器可能正在唤醒')};xhr.send(null);
    }
    function load(){
      if(PROJECT){loadProject(PROJECT);return}
      var xhr=new XMLHttpRequest();sync.className='sync';sync.innerHTML='正在读取项目…';
      xhr.open('GET',API+'/api/projects?_='+new Date().getTime(),true);xhr.timeout=30000;
      xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{var data=JSON.parse(xhr.responseText),items=data.projects||[];if(!items.length)throw new Error('云端暂无项目');PROJECT=items[0].name;loadProject(PROJECT)}catch(e){fail(e.message)}}else fail('服务器响应 '+xhr.status)};
      xhr.onerror=function(){fail('网络连接失败')};xhr.ontimeout=function(){fail('连接超时')};xhr.send(null);
    }
    function fail(msg){sync.className='sync error';sync.innerHTML='同步失败 · 确定键重试';if(content.getElementsByClassName('board').length===0)content.innerHTML='<div class="message">应用已正常启动<br>暂时无法读取数据：'+esc(msg)+'<br>按遥控器确定键立即重试</div>'}
function manualRefresh(){var now=new Date().getTime();if(now-LAST_KEY_TIME<1000)return;LAST_KEY_TIME=now;sync.className='sync';sync.innerHTML='手动刷新中…';load()}
window.refreshKanban=manualRefresh;
document.onkeydown=function(e){var code=(e||window.event).keyCode;if(code===13||code===23||code===66){if(e&&e.preventDefault)e.preventDefault();manualRefresh();return false}};
    load();setInterval(load,300000);
  }());
  </script>
</body>
</html>
