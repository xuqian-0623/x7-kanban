<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能制造项目进度协同管理平台 - 智能空气炸锅 X7</title>
  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
  <script src="lib/babel.min.js"></script>
  <style>
    .bg-dark-700 { background-color: #1e293b; }
    .bg-dark-800 { background-color: #0f172a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .gradient-text {
      background: linear-gradient(135deg, #a78bfa, #8b5cf6, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
    .phase-wrapper { scroll-snap-type: x mandatory; }
    .phase-scroll { scroll-snap-align: start; }
    @media (max-width: 768px) {
      .kanban-scroll { overflow-x: auto; }
    }
    .delay-pulse {
      animation: delayPulse 2s ease-in-out infinite;
    }
    @keyframes delayPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }
    .node-card {
      transition: all 0.2s ease;
    }
    .node-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .toast-enter { animation: slideUp 0.3s ease-out; }
    .toast-exit { animation: fadeOut 0.3s ease-in forwards; }
    @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
    .rework-flash {
      animation: flashBorder 1.5s ease-in-out 3;
    }
    @keyframes flashBorder {
      0%, 100% { border-color: rgb(251, 146, 60); }
      50% { border-color: rgb(251, 191, 36); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', e => {
      console.error('JS ERROR:', e.error || e.message);
    });
  </script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useReducer, useCallback, useRef, createContext, useContext, useMemo } = React;

    // =========================== MOCK DATA ===========================
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);
    const fmt = (d) => { const m = d.getMonth()+1, dd = d.getDate(); return `${m<10?'0':''}${m}-${dd<10?'0':''}${dd}`; };
    const dateStr = (d) => d.toISOString().split('T')[0];

    const d = (m, day) => { return new Date(2026, m-1, day); };
    const initialPhases = () => [
      {
        id: 'design', name: '产品设计',
        color: '#8b5cf6',
        nodes: [
          { id: 'd1', name: '内部策划',     status: 'completed', planStart: d(6,1),  planEnd: d(6,5),  actualEnd: d(6,4),  dependsOn: [] },
          { id: 'd2', name: '任务开发',     status: 'completed', planStart: d(6,3),  planEnd: d(6,10), actualEnd: d(6,9),  dependsOn: ['d1'] },
          { id: 'd3', name: '内部开模',     status: 'completed', planStart: d(6,8),  planEnd: d(6,15), actualEnd: d(6,14), dependsOn: ['d2'] },
          { id: 'd4', name: '任务评估',     status: 'completed', planStart: d(6,12), planEnd: d(6,18), actualEnd: d(6,17), dependsOn: ['d3'] },
          { id: 'd5', name: '任务拆分',     status: 'completed', planStart: d(6,16), planEnd: d(6,22), actualEnd: d(6,21), dependsOn: ['d4'] },
          { id: 'd6', name: '内部验收',     status: 'completed', planStart: d(6,20), planEnd: d(6,25), actualEnd: d(6,24), dependsOn: ['d5'] },
        ]
      },
      {
        id: 'mold', name: '模具阶段',
        color: '#f59e0b',
        nodes: [
          { id: 'm1', name: '开模',         status: 'completed', planStart: d(6,10), planEnd: d(6,20), actualEnd: d(6,19),   dependsOn: ['d6'] },
          { id: 'm2', name: '模后处理',     status: 'completed', planStart: d(6,18), planEnd: d(6,25), actualEnd: d(6,24),   dependsOn: ['m1'] },
          { id: 'm3', name: 'T1试模',       status: 'completed', planStart: d(6,22), planEnd: d(6,28), actualEnd: d(6,27),   dependsOn: ['m2'] },
          { id: 'm4', name: 'T2试模',       status: 'delayed',   planStart: d(6,25), planEnd: d(7,5),                       dependsOn: ['m3'],
            delay: { reason: '分模线问题', expectedRecovery: d(7,28), impactDays: 3 } },
          { id: 'm5', name: 'T3试模',       status: 'pending',   planStart: d(7,8),  planEnd: d(7,15),                      dependsOn: ['m4'] },
          { id: 'm6', name: '验收签字',     status: 'pending',   planStart: d(7,12), planEnd: d(7,20),                      dependsOn: ['m5'] },
        ]
      },
      {
        id: 'ebo', name: 'EBO阶段',
        color: '#06b6d4',
        nodes: [
          { id: 'e1', name: '开模模具',     status: 'completed', planStart: d(6,20), planEnd: d(6,28), actualEnd: d(6,27), dependsOn: ['m4'] },
          { id: 'e2', name: '手板制作',     status: 'ongoing',   planStart: d(6,25), planEnd: d(7,5),                      dependsOn: ['e1'] },
          { id: 'e3', name: '内部手板',     status: 'pending',   planStart: d(7,1),  planEnd: d(7,8),                       dependsOn: ['e2'] },
          { id: 'e4', name: '包装手板',     status: 'ongoing',   planStart: d(6,25), planEnd: d(7,3),                      dependsOn: [] },
          { id: 'e5', name: '试模',         status: 'pending',   planStart: d(7,5),  planEnd: d(7,12),                      dependsOn: ['e3', 'e4'] },
          { id: 'e6', name: '试产',         status: 'pending',   planStart: d(7,10), planEnd: d(7,18),                      dependsOn: ['e5'] },
        ]
      },
      {
        id: 'eb1', name: 'EB1阶段',
        color: '#10b981',
        nodes: [
          { id: 'b1', name: '开模模具',     status: 'pending',   planStart: d(7,15), planEnd: d(7,22), dependsOn: ['e6'] },
          { id: 'b2', name: '手板',         status: 'pending',   planStart: d(7,18), planEnd: d(7,25), dependsOn: ['b1'] },
          { id: 'b3', name: '试装',         status: 'pending',   planStart: d(7,20), planEnd: d(7,28), dependsOn: ['b2'] },
          { id: 'b4', name: '试产',         status: 'pending',   planStart: d(7,22), planEnd: d(7,30), dependsOn: ['b3'] },
          { id: 'b5', name: '试产评审',     status: 'pending',   planStart: d(7,25), planEnd: d(8,2),  dependsOn: ['b4'] },
        ]
      },
      {
        id: 'batch', name: '中小批',
        color: '#f472b6',
        nodes: [
          { id: 's1', name: '试装',         status: 'pending',   planStart: d(8,1),  planEnd: d(8,8),  dependsOn: ['b5'] },
          { id: 's2', name: '试产',         status: 'pending',   planStart: d(8,5),  planEnd: d(8,12), dependsOn: ['s1'] },
          { id: 's3', name: '首批出货',     status: 'pending',   planStart: d(8,10), planEnd: d(8,18), dependsOn: ['s2'] },
        ]
      }
    ];

    // Auto-transition: pending → ongoing if planStart <= today
    const autoTransition = (phases) => {
      return phases.map(phase => ({
        ...phase,
        nodes: phase.nodes.map(n => {
          if (n.status === 'pending' && n.planStart <= TODAY && !n.delay) {
            return { ...n, status: 'ongoing' };
          }
          return n;
        })
      }));
    };

    // =========================== HELPER ===========================
    const getCountdown = (launchDate) => {
      const diff = new Date(launchDate) - TODAY;
      return Math.max(0, Math.ceil(diff / (86400000)));
    };

    const addDays = (date, days) => {
      const d = new Date(date); d.setDate(d.getDate() + days); return d;
    };

    const getAllNodes = (phases) => {
      const map = {};
      phases.forEach(p => p.nodes.forEach(n => { map[n.id] = { ...n, phaseId: p.id }; }));
      return map;
    };

    const getDownstreamNodes = (nodeId, phases) => {
      const nodeMap = getAllNodes(phases);
      const visited = new Set();
      const result = [];
      const traverse = (id) => {
        if (visited.has(id)) return;
        visited.add(id);
        for (const p of phases) {
          for (const n of p.nodes) {
            if (n.dependsOn.includes(id) && !visited.has(n.id)) {
              result.push(n.id);
              traverse(n.id);
            }
          }
        }
      };
      traverse(nodeId);
      return result;
    };

    const getPhaseById = (phases, phaseId) => phases.find(p => p.id === phaseId);
    const getNodeById = (phases, nodeId) => {
      for (const p of phases) {
        const n = p.nodes.find(x => x.id === nodeId);
        if (n) return { ...n, phaseId: p.id };
      }
      return null;
    };

    const countCompleted = (phases) => {
      let total = 0, done = 0;
      phases.forEach(p => p.nodes.forEach(n => { total++; if (n.status === 'completed') done++; }));
      return { done, total };
    };

    const createLog = (type, user, action, detail, target = '') => ({
      id: 'log-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      type, user, action, detail, target,
      timestamp: Date.now(),
    });

    const calcLaunchDate = (phases) => {
      // Find the longest path to 首批出货
      const nodeMap = getAllNodes(phases);
      let latestEnd = new Date(2026, 8, 16); // default Sep 16
      for (const p of phases) {
        for (const n of p.nodes) {
          if (n.planEnd > latestEnd) latestEnd = n.planEnd;
        }
      }
      latestEnd.setDate(latestEnd.getDate() + 5);
      return dateStr(latestEnd);
    };

    // =========================== REDUCER ===========================
    const actionTypes = {
      BATCH_ADVANCE: 'BATCH_ADVANCE',
      MARK_DELAYED: 'MARK_DELAYED',
      MARK_COMPLETED: 'MARK_COMPLETED',
      CREATE_REWORK: 'CREATE_REWORK',
      DISMISS_NOTIFICATION: 'DISMISS_NOTIFICATION',
      CLIENT_CONFIRM: 'CLIENT_CONFIRM',
      CLIENT_REJECT: 'CLIENT_REJECT',
      GATE_PASS: 'GATE_PASS',
      TERMINATE_PROJECT: 'TERMINATE_PROJECT',
      TICK: 'TICK',
    };

    const initState = () => {
      const phases = autoTransition(initialPhases());
      const launchDate = calcLaunchDate(phases);
      const phaseGates = {};
      phases.forEach(p => { phaseGates[p.id] = { status: 'pending' }; });
      // Phase 1 is already fully completed, mark its gate as passed
      phaseGates.design = { status: 'passed', passedAt: d(2026, 6, 26) };
      return {
        phases,
        launchDate,
        terminated: false,
        phaseGates,
        activityLog: [{
          id: 'log-init',
          type: 'system',
          user: '系统',
          action: '项目初始化',
          detail: '智能空气炸锅 X7 项目进度看板启动，5 个阶段 28 个任务节点加载完成',
          target: '',
          timestamp: Date.now() - 3600000,
        }],
        notifications: [{
          id: 'n1',
          type: 'delay',
          title: 'T2试模延期',
          reason: '分模线问题',
          impact: '连累 EB1 试产顺延',
          expectedRecovery: fmt(d(2026,7,28)),
          originalCountdown: 50,
          currentCountdown: getCountdown(launchDate),
          nodeId: 'm4',
          createdAt: Date.now() - 300000,
          dismissed: false,
        }],
        tick: 0,
      };
    };

    function projectReducer(state, action) {
      let phases, node, downstreamIds, delayDays, newNodes, launchDate, notifications, n;

      switch (action.type) {
        case actionTypes.BATCH_ADVANCE: {
          const phaseName = state.phases.find(p => p.id === action.phaseId)?.name || '';
          phases = state.phases.map(phase => {
            if (phase.id !== action.phaseId) return phase;
            return {
              ...phase,
              nodes: phase.nodes.map(n => {
                if (n.status === 'ongoing' && !n.delay) {
                  const depsDone = n.dependsOn.every(depId => {
                    for (const p of state.phases) {
                      const found = p.nodes.find(x => x.id === depId);
                      if (found) return found.status === 'completed';
                    }
                    return true;
                  });
                  if (depsDone) return { ...n, status: 'completed', actualEnd: new Date() };
                }
                return n;
              })
            };
          });
          const logB = createLog('batch_advance', '张伟', `批量推进「${phaseName}」`,
            `将 ${phaseName} 中所有满足前置条件的进行中节点一键标记为已完成`);
          return { ...state, phases, activityLog: [...state.activityLog, logB] };
        }

        case actionTypes.MARK_DELAYED: {
          phases = state.phases.map(phase => ({
            ...phase,
            nodes: phase.nodes.map(n => {
              if (n.id === action.nodeId) {
                return { ...n, status: 'delayed', delay: { reason: action.reason, expectedRecovery: action.expectedRecovery, impactDays: action.impactDays } };
              }
              return n;
            })
          }));
          // Shift downstream dates
          delayDays = action.impactDays || 3;
          downstreamIds = getDownstreamNodes(action.nodeId, phases);
          phases = phases.map(phase => ({
            ...phase,
            nodes: phase.nodes.map(n => {
              if (downstreamIds.includes(n.id)) {
                return { ...n, planStart: addDays(n.planStart, delayDays), planEnd: addDays(n.planEnd, delayDays) };
              }
              return n;
            })
          }));
          launchDate = calcLaunchDate(phases);
          const nodeName = getNodeById(state.phases, action.nodeId)?.name || '';
          notifications = [...state.notifications, {
            id: 'n' + Date.now(),
            type: 'delay',
            title: nodeName + '延期',
            reason: action.reason,
            impact: `影响后续 ${delayDays} 个节点顺延`,
            expectedRecovery: fmt(action.expectedRecovery),
            originalCountdown: getCountdown(state.launchDate),
            currentCountdown: getCountdown(launchDate),
            nodeId: action.nodeId,
            createdAt: Date.now(),
            dismissed: false,
          }];
          const logD = createLog('delay', '张伟', `标记「${nodeName}」为延期上报`,
            `原因：${action.reason}，预计 ${fmt(action.expectedRecovery)} 恢复，影响 ${delayDays} 个下游节点`);
          return { ...state, phases, launchDate, notifications, activityLog: [...state.activityLog, logD] };
        }

        case actionTypes.MARK_COMPLETED: {
          const cn = getNodeById(state.phases, action.nodeId);
          phases = state.phases.map(phase => ({
            ...phase,
            nodes: phase.nodes.map(n => {
              if (n.id === action.nodeId) {
                return { ...n, status: 'completed', actualEnd: new Date(), delay: undefined };
              }
              return n;
            })
          }));
          const logMC = createLog('batch_advance', '张伟', `「${cn?.name || ''}」问题已解决，标记为已完成`,
            cn?.delay ? `原延期原因：${cn.delay.reason}，已确认修复完成` : `节点已手动标记为完成`);
          return { ...state, phases, activityLog: [...state.activityLog, logMC] };
        }

        case actionTypes.CREATE_REWORK: {
          const srcNode = getNodeById(state.phases, action.sourceNodeId);
          const targetPhase = getPhaseById(state.phases, action.targetPhaseId);
          if (!srcNode || !targetPhase) return state;

          const v2Id = targetPhase.id + '_rework_v2_' + Date.now();
          const newReworkNode = {
            id: v2Id,
            name: `[${srcNode.name} V2 返修]`,
            status: 'ongoing',
            planStart: new Date(),
            planEnd: addDays(new Date(), 5),
            dependsOn: [],
            isRework: true,
            reworkSource: action.sourceNodeId,
          };

          phases = state.phases.map(phase => {
            if (phase.id === targetPhase.id) {
              return { ...phase, nodes: [...phase.nodes, newReworkNode] };
            }
            // Freeze the source node
            if (phase.id === srcNode.phaseId) {
              return {
                ...phase,
                nodes: phase.nodes.map(n => {
                  if (n.id === action.sourceNodeId) {
                    return { ...n, status: 'frozen', reworkV2Id: v2Id };
                  }
                  return n;
                })
              };
            }
            return phase;
          });

          launchDate = calcLaunchDate(phases);
          // Recalc countdown
          notifications = [...state.notifications, {
            id: 'n' + Date.now(),
            type: 'rework',
            title: `${srcNode.name}发现异常，已发起返修`,
            reason: `${srcNode.name}发现模具异常`,
            impact: `已创建 ${newReworkNode.name}，预计延长 3 天`,
            expectedRecovery: fmt(addDays(new Date(), 5)),
            originalCountdown: getCountdown(state.launchDate),
            currentCountdown: getCountdown(launchDate),
            nodeId: v2Id,
            createdAt: Date.now(),
            dismissed: false,
          }];
          const logR = createLog('rework', '张伟', `发起返修变更：${srcNode.name}`,
            `目标阶段「${targetPhase.name}」，生成 ${newReworkNode.name}，原节点冻结为等待资源`,
            targetPhase.id);
          return { ...state, phases, launchDate, notifications, activityLog: [...state.activityLog, logR] };
        }

        case actionTypes.DISMISS_NOTIFICATION: {
          notifications = state.notifications.map(n =>
            n.id === action.notificationId ? { ...n, dismissed: true } : n
          );
          return { ...state, notifications };
        }

        case actionTypes.CLIENT_CONFIRM: {
          const notifC = state.notifications.find(n => n.id === action.notificationId);
          notifications = state.notifications.map(n =>
            n.id === action.notificationId ? { ...n, dismissed: true, clientResponse: 'confirmed' } : n
          );
          const logC = createLog('client_confirm', '客户', `确认延期通知：「${notifC?.title || ''}」`,
            `客户已同意延期安排，预计 ${notifC?.expectedRecovery || ''} 前解决`);
          return { ...state, notifications, activityLog: [...state.activityLog, logC] };
        }

        case actionTypes.CLIENT_REJECT: {
          const notifR = state.notifications.find(n => n.id === action.notificationId);
          notifications = state.notifications.map(n =>
            n.id === action.notificationId ? { ...n, dismissed: true, clientResponse: 'rejected' } : n
          );
          const logR = createLog('client_reject', '客户', `驳回延期通知：「${notifR?.title || ''}」`,
            `客户驳回延期安排，要求加急处理！请项目经理立即沟通`);
          return { ...state, notifications, activityLog: [...state.activityLog, logR] };
        }

        case actionTypes.GATE_PASS: {
          const phaseName = state.phases.find(p => p.id === action.phaseId)?.name || '';
          const newGates = { ...state.phaseGates, [action.phaseId]: { status: 'passed', passedAt: new Date() } };
          const logG = createLog('batch_advance', '张伟', `「${phaseName}」阶段门审查通过`,
            `决策：阶段门通过。${phaseName} 全部节点状态已确认，可进入下一阶段`);
          return { ...state, phaseGates: newGates, activityLog: [...state.activityLog, logG] };
        }

        case actionTypes.TERMINATE_PROJECT: {
          const logT = createLog('system', '张伟', '【紧急】项目已终止',
            '智能空气炸锅 X7 项目已手动终止。所有未完成任务已冻结，阶段门状态清除。');
          const frozenGates = {};
          Object.keys(state.phaseGates).forEach(k => {
            frozenGates[k] = { ...state.phaseGates[k], status: 'terminated' };
          });
          return {
            ...state,
            terminated: true,
            phaseGates: frozenGates,
            activityLog: [...state.activityLog, logT, {
              id: 'log-terminate-' + Date.now(),
              type: 'client_reject',
              user: '系统',
              action: '项目终止通知已推送到企业微信群',
              detail: '所有项目成员已收到项目终止通知，请等待下一步安排。',
              target: '',
              timestamp: Date.now() + 500,
            }],
          };
        }

        case actionTypes.TICK: {
          return { ...state, tick: state.tick + 1 };
        }

        default:
          return state;
      }
    }

    // =========================== COMPONENTS ===========================

    // --- Icons ---
    const StatusIcon = ({ status, size = 20 }) => {
      const icons = {
        completed: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#10b981"/><path d="M8 12l3 3 5-5" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
        ongoing: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#8b5cf6"/><rect x="10" y="7" width="4" height="10" rx="1" fill="#fff"/></svg>,
        pending: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#475569"/><circle cx="12" cy="12" r="3" fill="#64748b"/></svg>,
        delayed: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#ef4444"/><path d="M12 7v5l3 3" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg>,
        frozen: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#8b5cf6" opacity="0.6"/><rect x="9" y="6" width="2" height="12" rx="1" fill="#fff"/><rect x="13" y="6" width="2" height="12" rx="1" fill="#fff"/></svg>,
      };
      return icons[status] || icons.pending;
    };

    const StatusBadge = ({ status }) => {
      const map = {
        completed: { bg: 'bg-emerald-500/20', text: 'text-emerald-400', label: '已完成' },
        ongoing: { bg: 'bg-violet-500/20', text: 'text-violet-400', label: '进行中' },
        pending: { bg: 'bg-slate-600/30', text: 'text-slate-400', label: '待开始' },
        delayed: { bg: 'bg-red-500/20', text: 'text-red-400', label: '已延期' },
        frozen: { bg: 'bg-purple-500/20', text: 'text-purple-400', label: '等待资源' },

      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${s.bg} ${s.text}`}>{s.label}</span>;
    };

    const ChevronDown = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6"/></svg>;

    // --- Project Header ---
    const ProjectHeader = ({ state, dispatch, onTerminate }) => {
      const [riskOpen, setRiskOpen] = useState(false);
      const { done, total } = countCompleted(state.phases);
      const progress = total > 0 ? Math.round((done / total) * 100) : 0;
      const countdown = getCountdown(state.launchDate);
      const activeNotifications = state.notifications.filter(n => !n.dismissed);
      const hasDelayed = state.phases.some(p => p.nodes.some(n => n.status === 'delayed'));
      const terminated = state.terminated;

      return (
        <div className={`rounded-xl p-5 mb-5 relative z-30 transition-all duration-500 ${
          terminated ? 'bg-red-950/60 border-2 border-red-500/40' : 'glass-card'

          {terminated && (
            <div className="absolute -top-3 left-1/2 -translate-x-1/2 px-6 py-1 bg-red-600 rounded-full shadow-lg shadow-red-600/30">
              <span className="text-xs font-bold text-white tracking-wider">⚠ 项目已终止 ⚠</span>
            </div>
          )}

          <div className="flex flex-wrap items-center gap-4">
            {/* Left: Project Info */}
            <div className="flex-1 min-w-[200px]">
              <div className="flex items-center gap-3 flex-wrap">
                <h1 className="text-xl font-bold text-white">智能空气炸锅 X7</h1>
                {terminated ? (
                  <span className="px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse-slow">已终止</span>
                ) : (
                  <span className="px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">进行中</span>
                )}
                <span className={`px-2 py-0.5 rounded text-xs font-medium border ${terminated ? 'bg-slate-700/30 text-slate-500 border-slate-600/20' : 'bg-sky-500/10 text-sky-400 border-sky-500/20'}`}>新品</span>
                <span className={`px-2 py-0.5 rounded text-xs font-medium border ${terminated ? 'bg-slate-700/30 text-slate-500 border-slate-600/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'}`}>量产准备中</span>
              </div>
              <div className="flex items-center gap-3 mt-2 text-sm text-slate-400">
                <span>👤 负责人：<span className="text-slate-200">张伟</span></span>
                <span>📅 启动：2026-06-01</span>
                <span>🏷️ 项目编号：X7-2026-A01</span>
              </div>
            </div>

            {/* Center: Progress */}
            <div className="flex items-center gap-4 px-4 py-2 rounded-lg bg-slate-800/50 min-w-[200px]">
              <div className="relative w-14 h-14">
                <svg className="w-14 h-14 -rotate-90" viewBox="0 0 36 36">
                  <circle cx="18" cy="18" r="15.5" fill="none" stroke="#1e293b" strokeWidth="3"/>
                  <circle cx="18" cy="18" r="15.5" fill="none" stroke="url(#progGrad)" strokeWidth="3" strokeDasharray={`${(progress/100)*97.4} 97.4`} strokeLinecap="round"/>
                  <defs>
                    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stopColor="#a78bfa"/>
                      <stop offset="100%" stopColor="#7c3aed"/>
                    </linearGradient>
                  </defs>
                </svg>
                <span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white">{progress}%</span>
              </div>
              <div>
                <div className="text-xs text-slate-400">项目进度</div>
                <div className="text-sm font-semibold text-white">{done}/{total} 任务完成</div>
              </div>
            </div>

            {/* Countdown */}
            <div className={`flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800/50 ${terminated ? 'opacity-50' : ''}`}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={terminated ? '#64748b' : '#f59e0b'} strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              <div>
                <div className="text-xs text-slate-500">距上市倒计时</div>
                <div className={`text-lg font-bold ${terminated ? 'text-slate-500' : countdown <= 30 ? 'text-red-400' : countdown <= 45 ? 'text-amber-400' : 'text-emerald-400'}`}>
                  {terminated ? '已终止' : countdown + '天'}
                </div>
              </div>
            </div>

            {/* Right area: Risk Panel + Terminate Button */}
            <div className="flex items-center gap-2">
              {/* Risk Panel */}
              <div className="relative z-40">
                <button
                  onClick={() => setRiskOpen(!riskOpen)}
                  disabled={terminated}
                  className={`flex items-center gap-2 px-4 py-2.5 rounded-lg transition-all duration-200 ${
                    terminated
                      ? 'bg-slate-800/30 border border-slate-700/20 text-slate-600 cursor-not-allowed'
                      : hasDelayed
                        ? 'bg-red-500/20 border border-red-500/40 text-red-400 hover:bg-red-500/30'

                >
                  {hasDelayed && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse-slow"/>}
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2L2 19h20L12 2zM12 9v4M12 17v.01"/></svg>
                  <span className="text-sm font-medium">
                    {terminated ? '项目已终止' : hasDelayed ? `[${activeNotifications.length}项延期] 上市倒计时${countdown}天` : '项目运行正常'}
                  </span>
                  {!terminated && <ChevronDown />}
                </button>

                {riskOpen && activeNotifications.length > 0 && (
                  <div className="absolute right-0 top-full mt-2 w-96 z-[1000] animate-fade-in">
                    <div className="rounded-xl p-4 shadow-2xl border border-red-500/40 bg-slate-800">
                      <div className="text-sm font-semibold text-red-400 mb-3">⚠️ 需关注的风险项</div>
                      {activeNotifications.map((notif, i) => (
                      <div key={notif.id} className={`${i > 0 ? 'mt-3 pt-3 border-t border-slate-600/50' : ''}`}>
                        <div className="flex items-start gap-2">
                          <span className="text-lg">{notif.type === 'rework' ? '🔧' : '⏰'}</span>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium text-slate-200">{notif.title}</div>
                            <div className="text-xs text-slate-400 mt-1">原因：{notif.reason}</div>
                            <div className="text-xs text-slate-400">影响：{notif.impact}</div>

            {/* Terminate Button */}
            {!terminated && (
              <button

              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                </svg>
                终止项目
              </button>
            )}
            {terminated && (
              <div className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg bg-slate-800/50 text-slate-600 text-xs font-medium flex-shrink-0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                </svg>

              </div>
            )}

          <div className="mt-3 h-1.5 rounded-full bg-slate-700/50 overflow-hidden">

          </div>
        </div>

    );

    // --- Task Detail Drawer ---
    const TaskDetailDrawer = ({ node, phaseName, onClose, onMarkDelay, onMarkCompleted, onRework }) => {
      if (!node) return null;
      const fmtDate = (d) => d ? `${d.getMonth()+1}月${d.getDate()}日` : '-';
      const statusMap = { completed: '✅ 已完成', ongoing: '⏳ 进行中', pending: '⏸️ 待开始', delayed: '⛔ 已延期', frozen: '⏸️ 等待资源' };

      return (
        <div className="fixed inset-0 z-50 flex justify-end">
          <div className="absolute inset-0 bg-black/60" onClick={onClose}/>
          <div className="relative w-full max-w-md bg-dark-700 border-l border-slate-600/50 shadow-2xl animate-slide-up overflow-y-auto">
            <div className="p-6">
              <div className="flex items-center justify-between mb-6">
                <h2 className="text-lg font-bold text-white">{node.name}</h2>
                <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors p-1">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>

              <div className="space-y-4">
                <div className="flex items-center gap-3">
                  <StatusIcon status={node.status} size={24}/>
                  <span className="text-sm font-medium">{statusMap[node.status] || '未知'}</span>
                  <StatusBadge status={node.status}/>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-800/50 rounded-lg p-3">
                    <div className="text-xs text-slate-400">所属阶段</div>
                    <div className="text-sm text-slate-200 mt-1">{phaseName}</div>
                  </div>
                  <div className="bg-slate-800/50 rounded-lg p-3">
                    <div className="text-xs text-slate-400">计划开始</div>
                    <div className="text-sm text-slate-200 mt-1">{fmtDate(node.planStart)}</div>
                  </div>
                  <div className="bg-slate-800/50 rounded-lg p-3">
                    <div className="text-xs text-slate-400">计划结束</div>
                    <div className="text-sm text-slate-200 mt-1">{fmtDate(node.planEnd)}</div>
                  </div>
                  <div className="bg-slate-800/50 rounded-lg p-3">
                    <div className="text-xs text-slate-400">前置依赖</div>
                    <div className="text-sm text-slate-200 mt-1">{node.dependsOn.length > 0 ? node.dependsOn.length + ' 个' : '无'}</div>
                  </div>
                </div>

                {node.delay && (
                  <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3">
                    <div className="text-sm font-medium text-red-400 mb-2">⛔ 延期详情</div>
                    <div className="text-xs text-slate-300">原因：{node.delay.reason}</div>
                    <div className="text-xs text-slate-300 mt-1">预计恢复：{fmtDate(node.delay.expectedRecovery)}</div>
                    <div className="text-xs text-amber-400 mt-1">影响天数：{node.delay.impactDays} 天</div>
                  </div>
                )}

                {node.reworkV2Id && (
                  <div className="bg-orange-500/10 border border-orange-500/30 rounded-lg p-3">
                    <div className="text-sm font-medium text-orange-400">🔄 已发起返修 (V2)</div>
                  </div>
                )}

                {/* Action buttons */}
                <div className="pt-4 border-t border-slate-600/30 space-y-2">
                  {/* Mark as completed — available for unresolved nodes */}
                  {(node.status === 'delayed' || node.status === 'frozen' || node.status === 'ongoing') && (
                    <button
                      onClick={() => { onMarkCompleted(node.id); onClose(); }}
                      className="w-full px-4 py-2.5 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-400 rounded-lg text-sm font-medium transition-all"
                    >
                      ✅ 标记为已完成
                    </button>
                  )}
                  {(node.status === 'ongoing' || node.status === 'pending') && (
                    <button
                      onClick={() => { onMarkDelay(node.id); onClose(); }}
                      className="w-full px-4 py-2.5 bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-400 rounded-lg text-sm font-medium transition-all"
                    >
                      ⛔ 标记为延期（异常上报）
                    </button>
                  )}
                  {node.status === 'pending' && (
                    <button
                      onClick={() => { onRework(node.id); onClose(); }}
                      className="w-full px-4 py-2.5 bg-orange-500/20 hover:bg-orange-500/30 border border-orange-500/40 text-orange-400 rounded-lg text-sm font-medium transition-all"
                    >
                      🔧 发起返修变更
                    </button>
                  )}
                  {/* Show solution hint for delayed nodes */}
                  {node.status === 'delayed' && node.delay && (
                    <div className="text-xs text-slate-500 bg-slate-800/50 rounded-lg px-3 py-2">
                      💡 问题解决后点击上方「✅ 标记为已完成」闭环，系统会自动清除延期标记并记录修复时间
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Delay Modal ---
    const DelayModal = ({ nodeId, phases, onClose, onSubmit }) => {
      const node = getNodeById(phases, nodeId);
      const [reason, setReason] = useState('');
      const [recoveryDate, setRecoveryDate] = useState('');
      const [impactDays, setImpactDays] = useState(3);
      const [error, setError] = useState('');

      if (!node) return null;

      const handleSubmit = () => {
        if (!reason.trim()) { setError('请填写延期原因'); return; }
        if (!recoveryDate) { setError('请选择预计恢复日期'); return; }
        const recovery = new Date(recoveryDate);
        if (recovery < TODAY) { setError('恢复日期不能早于今天'); return; }
        setError('');
        onSubmit(nodeId, reason.trim(), recovery, impactDays);
      };

      const defaultDate = node.planEnd > TODAY ? dateStr(node.planEnd) : dateStr(addDays(TODAY, 3));

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/60" onClick={onClose}/>
          <div className="relative w-full max-w-md bg-dark-700 border border-slate-600/50 rounded-xl shadow-2xl animate-fade-in p-6">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-bold text-white">⛔ 延期异常上报</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>

            <div className="mb-4 p-3 bg-slate-800/50 rounded-lg">

            </div>

            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5">延期原因 <span className="text-red-400">*</span></label>
                <textarea
                  value={reason}
                  onChange={e => setReason(e.target.value)}
                  placeholder="请输入延期原因，如：分模线问题、模具开裂..."
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-violet-500/50 focus:ring-1 focus:ring-violet-500/30 resize-none h-20"
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5">预计恢复日期 <span className="text-red-400">*</span></label>
                <input
                  type="date"
                  value={recoveryDate || defaultDate}
                  onChange={e => setRecoveryDate(e.target.value)}
                  min={dateStr(TODAY)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-violet-500/50 focus:ring-1 focus:ring-violet-500/30"
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5">预估影响天数</label>
                <div className="flex gap-2">
                  {[1, 2, 3, 5, 7, 10].map(d => (
                    <button
                      key={d}
                      onClick={() => setImpactDays(d)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                        impactDays === d
                          ? 'bg-red-500/30 border border-red-500/50 text-red-300'
                          : 'bg-slate-800 border border-slate-600 text-slate-400 hover:border-slate-500'
                      }`}
                    >{d}天</button>
                  ))}
                </div>
              </div>

              {error && <div className="text-sm text-red-400 bg-red-500/10 rounded-lg px-3 py-2">{error}</div>}

              <div className="flex gap-3 pt-2">

                <button onClick={handleSubmit} className="flex-1 px-4 py-2.5 bg-red-500/30 hover:bg-red-500/40 border border-red-500/50 text-red-300 rounded-lg text-sm font-medium transition-all">提交延期</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Rework Modal ---
    const ReworkModal = ({ sourceNodeId, phases, onClose, onSubmit }) => {
      const srcNode = getNodeById(phases, sourceNodeId);
      const [targetPhaseId, setTargetPhaseId] = useState('');
      const [error, setError] = useState('');

      if (!srcNode) return null;

      const validTargets = phases.filter(p => p.id !== srcNode.phaseId);

      const handleSubmit = () => {
        if (!targetPhaseId) { setError('请选择需要返修的目标阶段'); return; }
        setError('');
        onSubmit(sourceNodeId, targetPhaseId);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/60" onClick={onClose}/>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>

              <div className="text-xs text-slate-400">返修来源</div>

              <div className="text-xs text-slate-400 mt-1">
                所属阶段：{phases.find(p => p.id === srcNode.phaseId)?.name}

                      targetPhaseId === p.id
                        ? 'bg-orange-500/20 border border-orange-500/50 text-orange-300'
                        : 'bg-slate-800 border border-slate-600 text-slate-300 hover:border-slate-500'
                    }`}
                  >
                    <div className="font-medium">{p.name}</div>
                    <div className="text-xs text-slate-400 mt-0.5">{p.nodes.length} 个节点</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-lg mb-4">
              <div className="text-xs text-amber-400">系统将自动执行：</div>
              <ul className="text-xs text-slate-400 mt-1 space-y-0.5">
                <li>✅ 在目标阶段创建 V2 返修子节点</li>

                <li>🔔 推送风险通知到客户协同视窗</li>
