            </div>

            {error && <div className="text-sm text-red-400 bg-red-500/10 rounded-lg px-3 py-2 mb-4">{error}</div>}

            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm font-medium transition-all">取消</button>
              <button onClick={handleSubmit} className="flex-1 px-4 py-2.5 bg-orange-500/30 hover:bg-orange-500/40 border border-orange-500/50 text-orange-300 rounded-lg text-sm font-medium transition-all">确认发起返修</button>
            </div>
          </div>
        </div>
    );

    // --- Task Node Card ---
    const TaskNode = ({ node, phaseColor, phaseName, onClick, onMarkCompleted }) => {
      const fmt = (d) => d ? `${d.getMonth()+1}/${d.getDate()}` : '-';
      const isDelayed = node.status === 'delayed';
      const isRework = node.isRework;
      const isFrozen = node.status === 'frozen';
      const canQuickComplete = (node.status === 'ongoing' || node.status === 'delayed' || node.status === 'frozen');

      return (
        <div
          onClick={() => onClick(node)}
          className={`node-card relative group p-3 rounded-xl cursor-pointer transition-all ${
            isDelayed
              ? 'bg-red-500/10 border-2 border-red-500/50 delay-pulse'
              : isRework
                ? 'bg-orange-500/10 border border-orange-500/40 rework-flash'
                : isFrozen
                  ? 'bg-purple-500/10 border border-purple-500/30'
                  : node.status === 'completed'
                    ? 'bg-emerald-500/5 border border-emerald-500/20 hover:border-emerald-500/40'
                    : node.status === 'ongoing'
                      ? 'bg-slate-700/40 border border-slate-600/40 hover:border-violet-500/40'
                      : 'bg-slate-800/30 border border-slate-700/30 hover:border-slate-600/50'
          }`}
        >
          {/* Top-right badges (existing) */}
          {isRework && (
            <div className="absolute -top-2 -right-2 px-2 py-0.5 bg-orange-500 rounded-full text-xs font-bold text-white shadow-lg z-10">
              V2
            </div>
          )}
          {isDelayed && (
            <div className="absolute -top-2 -right-2 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center shadow-lg z-10">
              <span className="text-xs font-bold text-white">!</span>
            </div>
          )}
          {isFrozen && (
            <div className="absolute -top-2 -right-2 w-5 h-5 bg-purple-500 rounded-full flex items-center justify-center shadow-lg z-10">
              <span className="text-xs text-white">⏸️</span>
            </div>
          )}

          {/* Quick complete button — hover to reveal */}
          {canQuickComplete && (
            <button
              onClick={(e) => { e.stopPropagation(); onMarkCompleted(node.id); }}
              className="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-200 bg-slate-700/80 border border-slate-500/50 hover:bg-emerald-500/20 hover:border-emerald-500/50 hover:scale-110 z-20 shadow-lg"
              title="快捷标记为已完成"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
          )}

          <div className="flex items-start gap-2.5">
            <StatusIcon status={node.status} size={18}/>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold text-slate-100 truncate">{node.name}</div>
              <div className="flex items-center gap-1.5 mt-1.5">
                <span className="text-xs text-slate-500">📅</span>
                <span className="text-xs text-slate-400">{fmt(node.planStart)} - {fmt(node.planEnd)}</span>
              </div>
              <div className="mt-1.5">
                <StatusBadge status={node.status}/>
              </div>
              {node.delay && (
                <div className="mt-1.5 bg-red-500/15 rounded px-2 py-1">
                  <div className="text-xs text-red-300">⚠️ {node.delay.reason}</div>
                  <div className="text-xs text-amber-300">恢复日：{node.delay.expectedRecovery ? `${node.delay.expectedRecovery.getMonth()+1}/${node.delay.expectedRecovery.getDate()}` : '-'}</div>
                </div>
              )}
              {isRework && (
                <div className="mt-1.5 bg-orange-500/15 rounded px-2 py-1">
                  <div className="text-xs text-orange-300">🔄 返修进行中</div>
                </div>
              )}
            </div>
          </div>
        </div>
    );

    // --- Phase Kanban Column ---
    const PhaseColumn = ({ phase, allPhases, phaseGates, onGateReview, onNodeClick, onMarkCompleted }) => {
      const { done, total } = { done: phase.nodes.filter(n => n.status === 'completed').length, total: phase.nodes.length };
      const phaseProgress = total > 0 ? Math.round((done / total) * 100) : 0;
      const hasBlocker = phase.nodes.some(n => n.status === 'delayed' || n.status === 'frozen');
      const gatePassed = phaseGates?.[phase.id]?.status === 'passed';

      return (
        <div className="phase-scroll flex-shrink-0 w-[280px] md:w-[300px]">
          <div className={`glass-card rounded-xl overflow-hidden h-full transition-all duration-300 ${
            gatePassed ? 'ring-1 ring-emerald-500/30' : ''
          }`}>
            {/* Phase header */}
            <div className="px-4 py-3 border-b border-slate-600/40" style={{ borderLeftColor: phase.color, borderLeftWidth: 3 }}>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 min-w-0">
                  <h3 className="text-sm font-bold text-white truncate">{phase.name}</h3>
                  {hasBlocker && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse-slow flex-shrink-0" title="存在阻塞项"/>}
                  {gatePassed && <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex-shrink-0">阶段门已过</span>}
                </div>
                <span className={`text-xs font-medium px-2 py-0.5 rounded-full flex-shrink-0 ${
                  phaseProgress === 100 ? 'bg-emerald-500/20 text-emerald-400' :
                  phaseProgress > 0 ? 'bg-violet-500/20 text-violet-400' :
                  'bg-slate-600/30 text-slate-400'
                }`}>{done}/{total}</span>
              </div>
              {/* Phase mini progress */}
              <div className="mt-2 h-1 rounded-full bg-slate-700/50 overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${phaseProgress}%`, backgroundColor: gatePassed ? '#10b981' : phase.color }}/>
              </div>
            </div>

            {/* Nodes */}
            <div className="p-3 space-y-2.5">
              {phase.nodes.map(node => (
                <TaskNode
                  key={node.id}
                  node={node}
                  phaseColor={phase.color}
                  phaseName={phase.name}
                  onClick={onNodeClick}
                  onMarkCompleted={onMarkCompleted}
                />
              ))}
            </div>

            {/* Gate Review Button */}
            <div className="px-3 pb-3">
              <button
                onClick={() => onGateReview(phase.id)}
                className={`w-full px-3 py-2 rounded-lg text-xs font-medium transition-all border ${
                  gatePassed
                    ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400 cursor-default'
                    : hasBlocker
                      ? 'bg-amber-500/15 border-amber-500/30 text-amber-300 hover:bg-amber-500/25'
                      : 'bg-violet-500/10 border-violet-500/25 text-violet-300 hover:bg-violet-500/20'
                }`}
              >
                <div className="flex items-center justify-center gap-1.5">
                  {gatePassed ? (
                    <><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>✅ 阶段门已通过</span></>
                  ) : (
                    <><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>阶段门审查</span>{hasBlocker && <span className="text-[10px] px-1 py-0.5 rounded bg-red-500/20 text-red-300 ml-1">有阻塞</span>}</>
                  )}
                </div>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Gate Review Modal ---
    const GateReviewModal = ({ phaseId, phases, phaseGates, onClose, onPassGate }) => {
      const phase = phases.find(p => p.id === phaseId);
      if (!phase) return null;

      const nodes = phase.nodes;
      const { done, total } = { done: nodes.filter(n => n.status === 'completed').length, total: nodes.length };
      const blockers = nodes.filter(n => n.status === 'delayed' || n.status === 'frozen');
      const ongoing = nodes.filter(n => n.status === 'ongoing');
      const gateInfo = phaseGates[phaseId];

      const fmtDate = (d) => d ? `${d.getMonth()+1}月${d.getDate()}日` : '-';
      const statusLabel = (s) => ({ completed: '✅ 已完成', ongoing: '⏳ 进行中', pending: '⏸️ 待开始', delayed: '⛔ 已延期', frozen: '⏸️ 冻结' })[s] || s;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/60" onClick={onClose}/>
          <div className="relative w-full max-w-2xl bg-dark-700 border border-slate-600/50 rounded-xl shadow-2xl animate-fade-in max-h-[85vh] flex flex-col">
            {/* Header */}
            <div className="px-6 py-4 border-b border-slate-600/30 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-lg" style={{ backgroundColor: phase.color + '20' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={phase.color} strokeWidth="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                  </svg>
                </div>
                <div>
                  <h2 className="text-lg font-bold text-white">阶段门审查：{phase.name}</h2>
                  <div className="text-xs text-slate-400 mt-0.5">
                    审查状态：
                    {gateInfo?.status === 'passed'
                      ? <span className="text-emerald-400 font-medium"> ✅ 已通过（{fmtDate(gateInfo.passedAt)}）</span>
                      : <span className="text-amber-400 font-medium"> ⏳ 待审查</span>
                    }
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>

            {/* Body */}
            <div className="flex-1 overflow-y-auto px-6 py-4 space-y-5">
              {/* Progress */}
              <div className="bg-slate-800/50 rounded-lg p-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm font-medium text-slate-200">阶段进度</span>
                  <span className="text-sm text-slate-400">{done}/{total} 节点完成</span>
                </div>
                <div className="h-2 rounded-full bg-slate-700/50 overflow-hidden">
                  <div className="h-full rounded-full transition-all duration-500" style={{ width: `${(done/total)*100}%`, backgroundColor: phase.color }}/>
                </div>
              </div>

              {/* Node Checklist */}
              <div>
                <h4 className="text-sm font-semibold text-slate-200 mb-3">📋 节点审查清单</h4>
                <div className="space-y-2">
                  {nodes.map(node => (
                    <div key={node.id} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg ${
                      node.status === 'delayed' ? 'bg-red-500/10 border border-red-500/20' :
                      node.status === 'frozen' ? 'bg-purple-500/10 border border-purple-500/20' :
                      node.status === 'ongoing' ? 'bg-violet-500/5 border border-violet-500/10' :
                      node.status === 'completed' ? 'bg-emerald-500/5 border border-emerald-500/10' :
                      'bg-slate-800/30 border border-slate-700/20'
                    }`}>
                      <StatusIcon status={node.status} size={18}/>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-sm font-medium text-slate-200">{node.name}</span>
                          <StatusBadge status={node.status}/>
                          {node.isRework && <span className="px-1 py-0.5 rounded text-[10px] bg-orange-500/20 text-orange-300 font-bold">V2 返修</span>}
                        </div>
                        <div className="text-xs text-slate-500 mt-0.5">
                          计划：{fmtDate(node.planStart)} - {fmtDate(node.planEnd)}
                          {node.delay && <span className="text-red-400 ml-2">⚠️ {node.delay.reason}</span>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Blockers */}
              {blockers.length > 0 && (
                <div className="bg-red-500/5 border border-red-500/20 rounded-lg p-4">
                  <h4 className="text-sm font-semibold text-red-400 mb-2">⛔ 阻塞项（{blockers.length}）</h4>
                  <div className="space-y-2">
                    {blockers.map(b => (
                      <div key={b.id} className="text-xs text-slate-300 flex items-start gap-2">
                        <span>•</span>
                        <div>
                          <span className="font-medium">{b.name}</span>
                          {b.delay && <span className="text-red-300 ml-1">— {b.delay.reason}</span>}
                          {b.status === 'frozen' && <span className="text-purple-300 ml-1">— 等待 V2 返修</span>}
                        </div>
                      </div>
                    ))}
                    <div className="mt-2 text-xs text-amber-400">
                      💡 建议：先解决上述阻塞项再通过阶段门，或标记为"有条件通过"并设定跟踪项
                    </div>
                  </div>
                </div>
              )}

              {/* Gate Decision */}
              <div className="bg-slate-800/30 border border-slate-600/30 rounded-lg p-4">
                <h4 className="text-sm font-semibold text-slate-200 mb-3">🎯 阶段门决策</h4>

                {gateInfo?.status === 'passed' ? (
                  <div>
                    <div className="flex items-center gap-2 text-sm text-emerald-400 mb-2">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                      <span className="font-bold">此阶段门已于 {fmtDate(gateInfo.passedAt)} 通过</span>
                    </div>
                    <div className="text-xs text-slate-400">
                      决策已记录，已推送到企业微信群。后续阶段工作可正常开展。
                    </div>
                  </div>
                ) : (
                  <div>
                    <div className="text-xs text-slate-400 mb-3 space-y-1">
                      <div>💡 通过阶段门表示：本阶段工作已确认，管理决策同意进入下一阶段</div>
                      <div className="text-slate-500">操作后将：</div>
                      <ul className="text-slate-500 list-disc pl-4 space-y-0.5">
                        <li>阶段卡片显示「✅ 阶段门已过」状态标识</li>
                        <li>阶段门状态从「待审查」变为「已通过」</li>
                        <li>记录决策日志并推送到企业微信群通知全员</li>
                      </ul>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={() => { onPassGate(phaseId); onClose(); }}
                        className={`px-4 py-2.5 rounded-lg text-sm font-medium transition-all ${
                          blockers.length > 0
                            ? 'bg-amber-500/20 border border-amber-500/40 text-amber-300 hover:bg-amber-500/30'
                            : 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-500/30'
                        }`}
                      >
                        {blockers.length > 0 ? '⚠️ 有条件通过阶段门' : '✅ 确认通过阶段门'}
                      </button>
                      <button
                        onClick={onClose}
                        className="px-4 py-2.5 rounded-lg text-sm font-medium bg-slate-700 border border-slate-600/30 text-slate-300 hover:bg-slate-600 transition-all"
                      >
                        暂不通过，关闭
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Terminate Project Confirm Modal (二重确认) ---
    const TerminateConfirmModal = ({ onClose, onConfirm }) => {
      const [step, setStep] = useState(1);
      const [input, setInput] = useState('');
      const [error, setError] = useState('');

      const handleConfirm = () => {
        if (step === 1) {
          setStep(2);
          return;
        }
        if (input !== '终止') {
          setError('请输入「终止」以确认');
          return;
        }
        onConfirm();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/60" onClick={onClose}/>
          <div className="relative w-full max-w-md bg-dark-700 border border-slate-600/50 rounded-xl shadow-2xl animate-fade-in p-6">
            {step === 1 ? (
              <>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2">
                        <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                      </svg>
                    </div>
                    <h2 className="text-lg font-bold text-white">确认终止项目</h2>
                  </div>
                  <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                  </button>
                </div>

                <div className="bg-red-500/10 border border-red-500/20 rounded-lg p-4 mb-4">
                  <div className="text-sm font-bold text-red-400 mb-2">⚠️ 此操作不可撤销！</div>
                  <ul className="text-xs text-slate-300 space-y-1.5">
                    <li>• 所有未完成任务将被冻结</li>
                    <li>• 阶段门状态将被清除</li>
                    <li>• 上市倒计时停止</li>
                    <li>• 所有项目成员将通过企业微信收到通知</li>
                    <li>• 项目数据将被归档</li>
                  </ul>
                </div>

                <div className="flex gap-3">
                  <button onClick={onClose} className="flex-1 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm font-medium transition-all">取消</button>
                  <button onClick={handleConfirm} className="flex-1 px-4 py-2.5 bg-red-500/30 hover:bg-red-500/40 border border-red-500/50 text-red-300 rounded-lg text-sm font-medium transition-all">下一步</button>
                </div>
              </>
            ) : (
              <>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2">
                        <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                      </svg>
                    </div>
                    <h2 className="text-lg font-bold text-white">二次确认</h2>
                  </div>
                  <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                  </button>
                </div>

                <div className="text-sm text-slate-300 mb-3">
                  请输入 <span className="text-red-400 font-bold">「终止」</span> 以确认操作：
                </div>
                <input
                  type="text"
                  value={input}
                  onChange={e => { setInput(e.target.value); setError(''); }}
                  onKeyDown={e => { if (e.key === 'Enter' && input === '终止') handleConfirm(); }}
                  placeholder="请输入「终止」"
                  className="w-full px-3 py-2.5 bg-slate-800 border border-slate-600 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500/50 focus:ring-1 focus:ring-red-500/30 mb-3"
                  autoFocus
                />
                {error && <div className="text-sm text-red-400 bg-red-500/10 rounded-lg px-3 py-2 mb-3">{error}</div>}

                <div className="flex gap-3">
                  <button onClick={() => setStep(1)} className="flex-1 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm font-medium transition-all">返回</button>
                  <button
                    onClick={handleConfirm}
                    disabled={input !== '终止'}
                    className={`flex-1 px-4 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      input === '终止'
                        ? 'bg-red-500/30 hover:bg-red-500/40 border border-red-500/50 text-red-300'
                        : 'bg-slate-800/50 border border-slate-700/30 text-slate-600 cursor-not-allowed'
                    }`}
                  >
                    确认终止
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
    );
  };

    // --- WeCom Push Toast (模拟企业微信机器人推送) ---
    const WecomToast = ({ logs, onDismiss }) => {
      const latest = logs.length > 0 ? logs[logs.length - 1] : null;
      if (!latest || ['system', 'init'].includes(latest.type)) return null;
      const [dismissed, setDismissed] = useState(false);

      useEffect(() => {
        setDismissed(false);
        const timer = setTimeout(() => setDismissed(true), 6000);
        return () => clearTimeout(timer);
      }, [latest?.id]);

      if (dismissed) return null;

      const typeStyles = {
        client_confirm: { border: 'border-l-emerald-500', icon: '✅', bg: 'from-emerald-500/10' },
        client_reject: { border: 'border-l-red-500', icon: '⛔', bg: 'from-red-500/10' },
        delay: { border: 'border-l-red-500', icon: '⏰', bg: 'from-red-500/10' },
        rework: { border: 'border-l-orange-500', icon: '🔧', bg: 'from-orange-500/10' },
        batch_advance: { border: 'border-l-violet-500', icon: '▶', bg: 'from-violet-500/10' },
      };
      const s = typeStyles[latest.type] || { border: 'border-l-slate-500', icon: '📢', bg: 'from-slate-500/10' };

      return (
        <div className="fixed top-4 right-4 z-[9999] animate-slide-up max-w-[400px] min-w-[320px]">
          <div className={`rounded-xl shadow-2xl border border-slate-600/50 bg-gradient-to-r ${s.bg} to-slate-800 overflow-hidden`}>
            {/* Head */}
            <div className="flex items-center gap-2 px-3 py-2 bg-slate-800/80 border-b border-slate-600/30">
              <div className="w-5 h-5 rounded bg-emerald-500/20 flex items-center justify-center">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
              </div>
              <span className="text-xs font-semibold text-emerald-400">企业微信 · 项目群</span>
              <span className="flex-1"/>
              <button onClick={() => setDismissed(true)} className="text-xs text-slate-500 hover:text-slate-300">✕</button>
            </div>
            {/* Body */}
            <div className="px-3 py-3">
              <div className="flex items-center gap-2 mb-1.5">
                <span className={`w-2 h-2 rounded-full ${latest.type === 'client_reject' ? 'bg-red-500 animate-pulse-slow' : 'bg-emerald-500'}`}/>
                <span className="text-xs font-bold text-white">
                  「智能空气炸锅 X7」项目通知
                </span>
              </div>
              <div className="text-sm font-bold text-slate-100 mb-1">
                {s.icon} {latest.action}
              </div>
              <div className="text-xs text-slate-400 mb-1">{latest.detail}</div>
              <div className="flex items-center gap-3 text-xs text-slate-500">
                <span>👤 {latest.user}</span>
                <span>🕐 {new Date(latest.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</span>
              </div>
              <div className="mt-2 pt-2 border-t border-slate-600/30 flex items-center gap-2 text-xs">
                <span className="text-slate-500">📨 已推送到「X7 项目协同群」</span>
                <span className="w-1 h-1 rounded-full bg-slate-600"/>
                <span className="text-emerald-500">3 人已读</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Activity Log Panel ---
    const ActivityLogPanel = ({ logs }) => {
      const [open, setOpen] = useState(false);
      const logList = useMemo(() => [...logs].reverse(), [logs]);

      const typeMap = {
        client_confirm: { icon: '✅', color: 'text-emerald-400', label: '客户确认' },
        client_reject: { icon: '❌', color: 'text-red-400', label: '客户驳回' },
        delay: { icon: '⛔', color: 'text-red-400', label: '延期上报' },
        rework: { icon: '🔧', color: 'text-orange-400', label: '返修发起' },
        batch_advance: { icon: '▶', color: 'text-violet-400', label: '批量推进' },
        system: { icon: 'ℹ️', color: 'text-blue-400', label: '系统' },
      };

      return (
        <div className="glass-card rounded-xl overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-700/30 transition-colors"
          >
            <div className="flex items-center gap-2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
              <span className="text-sm font-semibold text-slate-200">操作记录</span>
              <span className="px-1.5 py-0.5 rounded text-xs bg-slate-600/30 text-slate-400">{logs.length}</span>
              <span className="px-1.5 py-0.5 rounded text-xs bg-green-500/20 text-green-400">企业微信群同步</span>
            </div>
            <div className="flex items-center gap-2">
              {logs.length > 1 && (
                <span className="text-xs text-slate-500">
                  最新：{new Date(logs[logs.length-1]?.timestamp || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}
                </span>
              )}
              <svg className={`transition-transform duration-200 ${open ? 'rotate-180' : ''}`} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </button>

          {open && (
            <div className="max-h-[320px] overflow-y-auto border-t border-slate-600/30">
              {logList.length === 0 && (
                <div className="px-4 py-6 text-center text-sm text-slate-500">暂无操作记录</div>
              )}
              {logList.map(log => {
                const t = typeMap[log.type] || { icon: '📋', color: 'text-slate-400', label: '操作' };
                return (
                  <div key={log.id} className="px-4 py-2.5 border-b border-slate-600/20 hover:bg-slate-700/20 transition-colors last:border-b-0">
                    <div className="flex items-start gap-2.5">
                      <span className={`mt-0.5 w-6 h-6 rounded-full flex items-center justify-center text-xs ${
                        log.type.startsWith('client') ? 'bg-sky-500/10' :
                        log.type === 'delay' ? 'bg-red-500/10' :
                        log.type === 'rework' ? 'bg-orange-500/10' :
                        'bg-slate-600/20'
                      }`}>{t.icon}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className={`text-xs font-semibold ${t.color}`}>{t.label}</span>
                          {log.type === 'client_reject' && (
                            <span className="px-1.5 py-0.5 rounded text-[10px] bg-red-500/20 text-red-300 font-bold animate-pulse-slow">⚠️ 需紧急处理</span>
                          )}
                          {log.type === 'rework' && (
                            <span className="px-1.5 py-0.5 rounded text-[10px] bg-orange-500/20 text-orange-300">V2</span>
                          )}
                          <span className="text-xs text-slate-500">·</span>
                          <span className="text-xs text-slate-200 font-medium">{log.action}</span>
                        </div>
                        <div className="text-xs text-slate-400 mt-0.5">{log.detail}</div>
                        <div className="flex items-center gap-3 mt-0.5 text-[11px] text-slate-500">
                          <span>👤 {log.user}</span>
                          <span>🕐 {new Date(log.timestamp).toLocaleString('zh-CN')}</span>
                          <span className="text-emerald-500/60">📨 已同步企业微信群</span>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // --- Client Notification Panel ---
    const ClientNotificationPanel = ({ notifications, onDismiss, onConfirm, onReject }) => {
      const [collapsed, setCollapsed] = useState({});
      // Show all notifications; active = not yet confirmed/rejected
      const allItems = notifications;
      const unresolved = allItems.filter(n => n.clientResponse !== 'confirmed' && n.clientResponse !== 'rejected');
      if (allItems.length === 0) return null;

      const toggleCollapse = (id) => {
        setCollapsed(prev => ({ ...prev, [id]: !prev[id] }));
      };
      const isCollapsed = (id) => collapsed[id] === true;

      return (
        <div className="mt-5">
          <div className="flex items-center gap-2 mb-3">
            {unresolved.length > 0 && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse-slow"/>}
            <h3 className="text-sm font-semibold text-slate-200">
              客户协同通知栏
              {unresolved.length > 0 && <span className="text-slate-400 font-normal ml-1">— {unresolved.length} 条待处理</span>}
              <span className="text-slate-500 text-xs font-normal ml-2">共 {allItems.length} 条</span>
            </h3>
          </div>
          <div className="space-y-2">
            {allItems.map((n, i) => {
              const collapsedMode = isCollapsed(n.id);

              if (collapsedMode) {
                return (
                  <div
                    key={n.id}
                    onClick={() => toggleCollapse(n.id)}
                    className="flex items-center gap-3 px-4 py-2 rounded-lg cursor-pointer transition-all bg-slate-800/30 border border-slate-700/20 hover:bg-slate-700/30 hover:border-slate-600/30"
                  >
                    <span className="text-sm">{n.type === 'rework' ? '🔧' : '🔔'}</span>
                    <span className="text-xs text-slate-400 truncate flex-1">{n.title}</span>
                    {n.clientResponse === 'confirmed' && <span className="text-[10px] text-emerald-500 flex-shrink-0">✅ 已确认</span>}
                    {n.clientResponse === 'rejected' && <span className="text-[10px] text-red-400 flex-shrink-0">❌ 已驳回</span>}
                    {!n.clientResponse && <span className="text-[10px] text-amber-400 flex-shrink-0">⏸️ 已忽略</span>}
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2" className="flex-shrink-0"><path d="M18 15l-6-6-6 6"/></svg>
                  </div>
                );
              }

              return (
                <div
                  key={n.id}
                  className="rounded-xl p-4 border-l-4 animate-slide-up transition-all"
                  style={{
                    borderLeftColor: n.clientResponse === 'confirmed' ? '#10b981' : n.clientResponse === 'rejected' ? '#ef4444' : n.type === 'rework' ? '#f97316' : '#ef4444',
                    backgroundColor: n.clientResponse
                      ? 'rgba(30, 41, 59, 0.5)'
                      : 'rgba(30, 41, 59, 0.8)',
                    borderWidth: 1,
                    borderColor: n.clientResponse
                      ? 'rgba(51, 65, 85, 0.3)'
                      : 'rgba(51, 65, 85, 0.5)',
                  }}
                >
                  <div className="flex items-start gap-3">
                    <span className="text-xl mt-0.5">{n.type === 'rework' ? '🔧' : '🔔'}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-bold text-slate-100">
                        {n.type === 'rework' ? '【关键返修提醒】' : '【关键风险提醒】'}{n.title}
                      </div>
                      <div className="mt-2 space-y-1 text-xs">
                        <div className="text-slate-400">* 原因：{n.reason}</div>
                        <div className="text-slate-400">* 影响：{n.impact}</div>
                        <div className="text-slate-400">* 预计恢复时间：{n.expectedRecovery}</div>
                        <div className="text-red-400 font-medium">
                          * 当前倒计时：<span className="text-lg font-bold">{n.currentCountdown}天</span>
                          {n.originalCountdown > n.currentCountdown && (
                            <span className="text-slate-500 ml-1">（原{n.originalCountdown}天）</span>
                          )}
                        </div>
                      </div>

                      {/* Action buttons — only show if still unresolved */}
                      {!n.clientResponse && (
                        <div className="flex items-center gap-2 mt-3">
                          <button
                            onClick={() => onConfirm(n.id)}
                            className="px-3 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-400 rounded-lg text-xs font-medium transition-all"
                          >
                            ✅ 一键确认延期
                          </button>
                          <button
                            onClick={() => onReject(n.id)}
                            className="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-400 rounded-lg text-xs font-medium transition-all"
                          >
                            ❌ 驳回并要求加急
                          </button>
                          <button
                            onClick={() => { onDismiss(n.id); toggleCollapse(n.id); }}
                            className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-400 rounded-lg text-xs transition-all ml-auto"
                          >
                            稍后处理 ↕
                          </button>
                        </div>
                      )}
                      {n.clientResponse === 'confirmed' && (
                        <div className="mt-2 text-xs text-emerald-400">✅ 客户已确认延期通知</div>
                      )}
                      {n.clientResponse === 'rejected' && (
                        <div className="mt-2 text-xs text-red-400">❌ 客户已驳回并要求加急处理</div>
                      )}

                      {/* Expand/collapse toggle when resolved */}
                      {n.clientResponse && (
                        <button
                          onClick={() => toggleCollapse(n.id)}
                          className="mt-2 text-xs text-slate-500 hover:text-slate-300 transition-colors"
                        >
                          ↕ 收起
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {unresolved.length === 0 && (
            <div className="text-xs text-slate-500 mt-2">
              所有通知已处理。点击上方已折叠的记录可查看详情和重新操作。
            </div>
          )}
        </div>
      );
    };

    // --- Auto Status Checker Helper ---
    const runAutoTransition = (phases) => {
      let changed = false;
      const result = phases.map(phase => {
        const newNodes = phase.nodes.map(n => {
          if (n.status === 'pending' && n.planStart <= TODAY && !n.delay) {
            changed = true;
            return { ...n, status: 'ongoing' };
          }
          return n;
        });
        return { ...phase, nodes: newNodes };
      });
      return { phases: result, changed };
    };

    // =========================== MAIN APP ===========================
    const App = () => {
      const [state, dispatch] = useReducer(projectReducer, null, initState);
      const [selectedNode, setSelectedNode] = useState(null);
      const [delayModalNodeId, setDelayModalNodeId] = useState(null);
      const [reworkSourceNodeId, setReworkSourceNodeId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [gateReviewPhaseId, setGateReviewPhaseId] = useState(null);
      const [terminateModalOpen, setTerminateModalOpen] = useState(false);

      // Live countdown tick
      useEffect(() => {
        const interval = setInterval(() => dispatch({ type: actionTypes.TICK }), 60000);
        return () => clearInterval(interval);
      }, []);

      // Auto transition on mount (with delay for visual effect)
      useEffect(() => {
        const { phases: newPhases, changed } = runAutoTransition(state.phases);
        if (changed) {
          // We can't directly set state, but we can dispatch a custom action
          // Actually, let's handle auto-transition in the initial state and ignore dynamic since it's a demo
        }
      }, []);

      const handleNodeClick = useCallback((node) => {
        setSelectedNode(node);
        setSidebarOpen(true);
      }, []);

      const handleGateReview = useCallback((phaseId) => {
        setGateReviewPhaseId(phaseId);
      }, []);

      const handlePassGate = useCallback((phaseId) => {
        dispatch({ type: actionTypes.GATE_PASS, phaseId });
      }, []);

      const handleTerminateProject = useCallback(() => {
        dispatch({ type: actionTypes.TERMINATE_PROJECT });
        setTerminateModalOpen(false);
      }, []);

      const handleMarkDelay = useCallback((nodeId) => {
        setDelayModalNodeId(nodeId);
      }, []);

      const handleMarkCompleted = useCallback((nodeId) => {
        dispatch({ type: actionTypes.MARK_COMPLETED, nodeId });
      }, []);

      const handleDelaySubmit = useCallback((nodeId, reason, recoveryDate, impactDays) => {
        dispatch({ type: actionTypes.MARK_DELAYED, nodeId, reason, expectedRecovery: recoveryDate, impactDays });
        setDelayModalNodeId(null);
      }, []);

      const handleRework = useCallback((nodeId) => {
        setReworkSourceNodeId(nodeId);
      }, []);

      const handleReworkSubmit = useCallback((sourceNodeId, targetPhaseId) => {
        dispatch({ type: actionTypes.CREATE_REWORK, sourceNodeId, targetPhaseId });
        setReworkSourceNodeId(null);
      }, []);

      const { done, total } = countCompleted(state.phases);
      const progress = total > 0 ? Math.round((done / total) * 100) : 0;

      return (
        <div className="min-h-screen bg-dark-800">
          <div className="max-w-[1600px] mx-auto px-4 py-5">
            {/* Top Header */}
            <ProjectHeader state={state} dispatch={dispatch} onTerminate={() => setTerminateModalOpen(true)} />

            {/* Kanban Board */}
            <div className="flex gap-4 overflow-x-auto pb-4 kanban-scroll phase-wrapper">
              {state.phases.map(phase => (
                <PhaseColumn
                  key={phase.id}
                  phase={phase}
                  allPhases={state.phases}
                  phaseGates={state.phaseGates}
                  onGateReview={handleGateReview}
                  onNodeClick={handleNodeClick}
                  onMarkCompleted={handleMarkCompleted}
                />
              ))}
            </div>

            {/* Client Notification Panel */}
            <ClientNotificationPanel
              notifications={state.notifications}
              onDismiss={(id) => dispatch({ type: actionTypes.DISMISS_NOTIFICATION, notificationId: id })}
              onConfirm={(id) => dispatch({ type: actionTypes.CLIENT_CONFIRM, notificationId: id })}
              onReject={(id) => dispatch({ type: actionTypes.CLIENT_REJECT, notificationId: id })}
            />

            {/* Summary Stats */}
            <div className="mt-5 glass-card rounded-xl p-4">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 text-sm">
                    <span className="w-3 h-3 rounded-full bg-emerald-500"/>
                    <span className="text-slate-400">已完成</span>
                    <span className="text-white font-medium">{done}</span>
                  </div>
                  <div className="flex items-center gap-2 text-sm">
                    <span className="w-3 h-3 rounded-full bg-violet-500"/>
                    <span className="text-slate-400">进行中</span>
                    <span className="text-white font-medium">{state.phases.reduce((a, p) => a + p.nodes.filter(n => n.status === 'ongoing').length, 0)}</span>
                  </div>
                  <div className="flex items-center gap-2 text-sm">
                    <span className="w-3 h-3 rounded-full bg-red-500"/>
                    <span className="text-slate-400">已延期</span>
                    <span className="text-white font-medium">{state.phases.reduce((a, p) => a + p.nodes.filter(n => n.status === 'delayed').length, 0)}</span>
                  </div>
                  <div className="flex items-center gap-2 text-sm">
                    <span className="w-3 h-3 rounded-full bg-purple-500"/>
                    <span className="text-slate-400">冻结/等待</span>
                    <span className="text-white font-medium">{state.phases.reduce((a, p) => a + p.nodes.filter(n => n.status === 'frozen').length, 0)}</span>
                  </div>
                  <div className="flex items-center gap-2 text-sm">
                    <span className="w-3 h-3 rounded-full bg-slate-500"/>
                    <span className="text-slate-400">待开始</span>
                    <span className="text-white font-medium">{state.phases.reduce((a, p) => a + p.nodes.filter(n => n.status === 'pending').length, 0)}</span>
                  </div>
                </div>
                <div className="text-xs text-slate-500">
                  总计 {total} 个任务节点 · 距上市倒计时 {getCountdown(state.launchDate)} 天 · 目标上市日期：{state.launchDate}
                </div>
              </div>
            </div>
          </div>

          {/* WeCom Push Toast (fixed top-right) */}
          <WecomToast logs={state.activityLog} />

          {/* Activity Log */}
          <div className="max-w-[1600px] mx-auto px-4 pb-5">
            <ActivityLogPanel logs={state.activityLog} />
          </div>

          {/* Sidebar Drawer */}
          {sidebarOpen && selectedNode && (
            <TaskDetailDrawer
              node={selectedNode}
              phaseName={state.phases.find(p => p.nodes.some(n => n.id === selectedNode.id))?.name || ''}
              onClose={() => { setSidebarOpen(false); setSelectedNode(null); }}
              onMarkDelay={handleMarkDelay}
              onMarkCompleted={handleMarkCompleted}
              onRework={handleRework}
            />
          )}

          {/* Delay Modal */}
          {delayModalNodeId && (
            <DelayModal
              nodeId={delayModalNodeId}
              phases={state.phases}
              onClose={() => setDelayModalNodeId(null)}
              onSubmit={handleDelaySubmit}
            />
          )}

          {/* Rework Modal */}
          {reworkSourceNodeId && (
            <ReworkModal
              sourceNodeId={reworkSourceNodeId}
              phases={state.phases}
              onClose={() => setReworkSourceNodeId(null)}
              onSubmit={handleReworkSubmit}
            />
          )}

          {/* Gate Review Modal */}
          {gateReviewPhaseId && (
            <GateReviewModal
              phaseId={gateReviewPhaseId}
              phases={state.phases}
              phaseGates={state.phaseGates}
              onClose={() => setGateReviewPhaseId(null)}
              onPassGate={handlePassGate}
            />
          )}

          {/* Terminate Confirm Modal */}
          {terminateModalOpen && (
            <TerminateConfirmModal
              onClose={() => setTerminateModalOpen(false)}
              onConfirm={handleTerminateProject}
            />
          )}
        </div>
      );
    };

    // =========================== RENDER ===========================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
