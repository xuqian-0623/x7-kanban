        rework: { icon: '🔧', color: 'text-orange-600', label: '返修发起' },
        batch_advance: { icon: '▶', color: 'text-blue-400', label: '批量推进' },
        system: { icon: 'ℹ️', color: 'text-blue-400', label: '系统' },
      };

      return (
        <div className="glass-card rounded-xl overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-100 transition-colors"
          >
            <div className="flex items-center gap-2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
              <span className="text-sm font-semibold text-slate-700">操作记录</span>
              <span className="px-1.5 py-0.5 rounded text-xs bg-slate-200 text-slate-400">{logs.length}</span>
              <span className="px-1.5 py-0.5 rounded text-xs bg-green-100 text-green-400">企业微信群同步</span>
            </div>
            <div className="flex items-center gap-2">
              {logs.length > 1 && (
                <span className="text-xs text-slate-400">
                  最新：{new Date(logs[logs.length-1]?.timestamp || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}
                </span>
              )}
              <svg className={`transition-transform duration-200 ${open ? 'rotate-180' : ''}`} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </button>

          {open && (
            <div className="max-h-[320px] overflow-y-auto border-t border-slate-200">
              {logList.length === 0 && (
                <div className="px-4 py-6 text-center text-sm text-slate-400">暂无操作记录</div>
              )}
              {logList.map(log => {
                const t = typeMap[log.type] || { icon: '📋', color: 'text-slate-400', label: '操作' };
                return (
                  <div key={log.id} className="px-4 py-2.5 border-b border-slate-300 hover:bg-slate-100 transition-colors last:border-b-0">
                    <div className="flex items-start gap-2.5">
                      <span className={`mt-0.5 w-6 h-6 rounded-full flex items-center justify-center text-xs ${
                        log.type.startsWith('client') ? 'bg-blue-50' :
                        log.type === 'delay' ? 'bg-red-50' :
                        log.type === 'rework' ? 'bg-orange-50' :
                        'bg-slate-200'
                      }`}>{t.icon}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className={`text-xs font-semibold ${t.color}`}>{t.label}</span>
                          {log.type === 'client_reject' && (
                            <span className="px-1.5 py-0.5 rounded text-[10px] bg-red-100 text-red-600 font-bold animate-pulse-slow">⚠️ 需紧急处理</span>
                          )}
                          {log.type === 'rework' && (
                            <span className="px-1.5 py-0.5 rounded text-[10px] bg-orange-100 text-orange-600">V2</span>
                          )}
                          <span className="text-xs text-slate-400">·</span>
                          <span className="text-xs text-slate-700 font-medium">{log.action}</span>
                        </div>
                        <div className="text-xs text-slate-400 mt-0.5">{log.detail}</div>
                        <div className="flex items-center gap-3 mt-0.5 text-[11px] text-slate-400">
                          <span>👤 {log.user}</span>
                          <span>🕐 {new Date(log.timestamp).toLocaleString('zh-CN')}</span>
                          <span className="text-green-600/60">📨 已同步企业微信群</span>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // --- Shared: Lightbox (rendered via Portal) ---
    const ImageLightbox = ({ src, onClose }) => {
      if (!src) return null;
      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-[99999] flex items-center justify-center p-6 bg-black/90 backdrop-blur-sm" onClick={onClose} style={{ zIndex: 99999 }}>
          {/* 关闭按钮：单独容器，绝对定位且不被图片挡住 */}
          <button onClick={(e) => { e.stopPropagation(); onClose(); }} style={{ position: 'fixed', top: 16, right: 16, zIndex: 100000 }}
            className="text-white bg-black/60 hover:bg-red-600 rounded-full p-2.5 transition-colors shadow-lg">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
          {/* 图片：约束宽高 + object-contain + auto centering */}
          <img
            src={src}
            alt="预览"
            draggable={false}
            onClick={e => e.stopPropagation()}
            style={{
              maxWidth: 'calc(100vw - 48px)',
              maxHeight: 'calc(100vh - 48px)',
              width: 'auto',
              height: 'auto',
              objectFit: 'contain',
              display: 'block',
            }}
            className="rounded shadow-2xl"
          />
        </div>,
        document.body
      );
    };

    // --- Product Image Column ---
    const ProductImageColumn = ({ images, onUpload, onRemove }) => {
      const imageInputRef = React.useRef(null);
      const [previewImage, setPreviewImage] = useState(null);
      const clickTimerRef = React.useRef(null);

      const handleImageClick = (src, e) => {
        e.preventDefault();
        e.stopPropagation();
        if (clickTimerRef.current) {
          clearTimeout(clickTimerRef.current);
          clickTimerRef.current = null;
          if (images.length > 0) setPreviewImage(src);
        } else {
          clickTimerRef.current = setTimeout(() => { clickTimerRef.current = null; }, 250);
        }
      };

      const handleImage = async (e) => {
        e.stopPropagation();
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
        if (file.size > 20 * 1024 * 1024) { alert('图片不能超过 20MB'); return; }
        const compressed = await compressImage(file);
        const reader = new FileReader();
        reader.onload = (evt) => onUpload([...images, evt.target.result]);
        reader.readAsDataURL(compressed);
        e.target.value = '';
      };

      return (
        <div className="glass-card rounded-xl p-3 flex-shrink-0 w-[300px]">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-1.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              产品图片
              {images.length > 0 && <span className="text-[10px] text-slate-400 font-normal">({images.length})</span>}
            </h3>
            <button
              onClick={(e) => { e.stopPropagation(); imageInputRef.current?.click(); }}
              className="px-2 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded text-xs font-medium transition-all flex items-center gap-1"
            >
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>
              添加
            </button>
            <input ref={imageInputRef} type="file" accept="image/*" className="hidden" onChange={handleImage}/>
          </div>

          {images.length === 0 ? (
            <button
              onClick={() => imageInputRef.current?.click()}
              className="w-full h-48 border-2 border-dashed border-slate-300 hover:border-blue-400 hover:bg-blue-50 rounded-lg flex flex-col items-center justify-center gap-2 text-slate-400 hover:text-blue-500 transition-all"
            >
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              <span className="text-xs">点击添加产品图片</span>
              <span className="text-[10px] text-slate-400">支持多张 · 双击放大预览</span>
            </button>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {images.map((src, idx) => (
                <div key={idx} className="relative group rounded-lg overflow-hidden border border-slate-200">
                  <img
                    src={src}
                    alt={`产品图 ${idx + 1}`}
                    className="w-full h-28 object-cover cursor-zoom-in hover:opacity-90 transition-opacity select-none"
                    onClick={(e) => handleImageClick(src, e)}
                    onDoubleClick={(e) => { e.preventDefault(); e.stopPropagation(); setPreviewImage(src); }}
                    draggable={false}
                    title="双击放大预览"
                  />
                  <button
                    onClick={(e) => { e.stopPropagation(); onRemove(images.filter((_, i) => i !== idx)); }}
                    className="absolute top-1 right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center hover:bg-red-600"
                    title="删除此图"
                  >
                    ×
                  </button>
                </div>
              ))}
            </div>
          )}

          <ImageLightbox src={previewImage} onClose={() => setPreviewImage(null)}/>
        </div>
      );
    };

    // --- Product Files Column ---
    const ProductFilesColumn = ({ files, onAddFiles, onRemoveFile }) => {
      const filesInputRef = React.useRef(null);
      const [previewImage, setPreviewImage] = useState(null);
      const [linkForm, setLinkForm] = useState(null); // {name, url} or null

      const handleFiles = async (e) => {
        e.stopPropagation();
        const list = Array.from(e.target.files || []);
        if (list.length === 0) return;
        const newFiles = [];
        let pending = list.length;
        list.forEach(async (f, idx) => {
          if (f.size > 20 * 1024 * 1024) { alert(`${f.name} 超过 20MB 跳过`); pending--; if (pending === 0) commit(); return; }
          const compressed = await compressImage(f);
          const reader = new FileReader();
          reader.onload = (evt) => {
            newFiles[idx] = {
              id: 'f-' + Date.now() + '-' + idx,
              kind: 'file',
              name: f.name, type: compressed.type, size: compressed.size,
              dataUrl: evt.target.result,
              uploadedAt: Date.now(),
            };
            pending--;
            if (pending === 0) commit();
          };
          reader.readAsDataURL(compressed);
        });
        const commit = () => {
          const valid = newFiles.filter(Boolean);
          onAddFiles([...(files || []), ...valid]);
        };
        e.target.value = '';
      };

      const submitLink = () => {
        if (!linkForm.url.trim()) { alert('请输入外链 URL'); return; }
        let normalized = linkForm.url.trim();
        if (!/^https?:\/\//i.test(normalized)) normalized = 'https://' + normalized;
        const name = linkForm.name.trim() || normalized.split('/').pop() || '外链文件';
        const entry = {
          id: 'l-' + Date.now(),
          kind: 'link',
          name,
          url: normalized,
          source: (() => { try { return new URL(normalized).hostname; } catch { return ''; } })(),
          uploadedAt: Date.now(),
        };
        onAddFiles([...(files || []), entry]);
        setLinkForm(null);
      };

      const handleFileOpen = async (f, e) => {
        e.stopPropagation();
        if (f.kind === 'link') {
          window.open(f.url, '_blank', 'noopener');
          return;
        }
        if (f.type && f.type.startsWith('image/')) {
          setPreviewImage(f.dataUrl);
          return;
        }
        // dataUrl → Blob URL → 新 tab 打开。PDF 浏览器原生内嵌，其他类型浏览器自行处理
        try {
          const blob = await (await fetch(f.dataUrl)).blob();
          const blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank', 'noopener');
        } catch (err) {
          alert('打开失败：' + err.message);
        }
      };

      const getFileIcon = (f) => {
        if (f.kind === 'link') return '🔗';
        if (f.type.startsWith('image/')) return '🖼';
        if (f.type.includes('pdf')) return '📕';
        if (f.type.includes('word') || f.type.includes('document')) return '📄';
        if (f.type.includes('sheet') || f.type.includes('excel')) return '📊';
        if (f.type.includes('zip') || f.type.includes('rar')) return '🗜';
        return '📎';
      };

      return (
        <div className="glass-card rounded-xl p-3 flex-shrink-0 w-[280px] flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-1.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
              文件资料
              {(files || []).length > 0 && <span className="text-[10px] text-slate-400 font-normal">({files.length})</span>}
            </h3>
            <div className="flex gap-1">
              <button
                onClick={(e) => { e.stopPropagation(); filesInputRef.current?.click(); }}
                className="px-2 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded text-xs font-medium transition-all flex items-center gap-1"
                title="本地小文件（≤20MB）"
              >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                上传
              </button>
              <button
                onClick={(e) => { e.stopPropagation(); setLinkForm({ name: '', url: '' }); }}
                className="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded text-xs font-medium transition-all flex items-center gap-1"
                title="添加外链（推荐用于大文件）"
              >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                外链
              </button>
              <input ref={filesInputRef} type="file" multiple className="hidden" onChange={handleFiles}/>
            </div>
          </div>

          {/* Link form */}
          {linkForm && (
            <div className="mb-2 p-2 bg-amber-50 border border-amber-200 rounded-lg">
              <div className="text-[10px] font-semibold text-amber-600 mb-1.5">🔗 添加外链（不存文件，刷新也不丢）</div>
              <input
                type="text"
                value={linkForm.name}
                onChange={e => setLinkForm(p => ({ ...p, name: e.target.value }))}
                placeholder="文件名称（可留空）"
                className="w-full px-2 py-1.5 mb-1 bg-white border border-slate-200 rounded text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-amber-400"
              />
              <input
                type="text"
                value={linkForm.url}
                onChange={e => setLinkForm(p => ({ ...p, url: e.target.value }))}
                placeholder="https://...（云盘/网盘/GitHub 等）"
                className="w-full px-2 py-1.5 mb-1.5 bg-white border border-slate-200 rounded text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-amber-400"
              />
              <div className="flex gap-1.5">
                <button onClick={() => setLinkForm(null)} className="flex-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs transition-colors">取消</button>
                <button onClick={submitLink} className="flex-1 px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded text-xs font-medium transition-colors">保存外链</button>
              </div>
            </div>
          )}

          {/* Files list */}
          <div className="space-y-1.5 flex-1">
            {(files || []).map(f => {
              const isImage = f.kind !== 'link' && f.type && f.type.startsWith('image/');
              return (
                <div key={f.id} className="flex items-center gap-2 p-2 bg-white border border-slate-200 rounded group hover:border-blue-300 transition-colors">
                  <button
                    onClick={(e) => handleFileOpen(f, e)}
                    className="flex items-center gap-2 flex-1 min-w-0 text-left"
                    title={f.kind === 'link' ? '新窗口打开外链' : isImage ? '点击预览' : '点击打开'}
                  >
                    {isImage ? (
                      <img src={f.dataUrl} alt={f.name} className="w-12 h-12 rounded object-cover flex-shrink-0 border border-slate-200"/>
                    ) : (
                      <span className={`w-12 h-12 rounded flex items-center justify-center flex-shrink-0 text-2xl ${f.kind === 'link' ? 'bg-amber-50' : 'bg-slate-100'}`}>{getFileIcon(f)}</span>
                    )}
                    <div className="flex-1 min-w-0">
                      <div className="text-xs text-slate-700 truncate font-medium">{f.name}</div>
                      <div className="text-[10px] text-slate-400 mt-0.5">
                        {f.kind === 'link'
                          ? <><span className="text-amber-600">🔗 外链</span> · {f.source}</>
                          : <>{((f.size || 0)/1024).toFixed(0)} KB · {new Date(f.uploadedAt).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' })}</>
                        }
                      </div>
                    </div>
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); onRemoveFile(f.id); }}
                    className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 transition-all p-1 flex-shrink-0"
                    title="删除"
                  >
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
                  </button>
                </div>
              );
            })}
            {(!files || files.length === 0) && (
              <div className="text-center py-6 text-xs text-slate-400 border-2 border-dashed border-slate-200 rounded">
                <div className="text-2xl mb-2">📁</div>
                暂无文件<br/>
                <span className="text-[10px]">点「上传」传本地文件 · 点「外链」挂云盘链接</span>
              </div>
            )}
          </div>

          <ImageLightbox src={previewImage} onClose={() => setPreviewImage(null)}/>
        </div>
      );
    };

    // --- Client Notification Panel ---
    const ClientNotificationPanel = ({ notifications, onDismiss, onConfirm, onReject }) => {
      const [collapsed, setCollapsed] = useState({});
      // Show all notifications; active = not yet confirmed/rejected
      const allItems = notifications;
      const unresolved = allItems.filter(n => n.clientResponse !== 'confirmed' && n.clientResponse !== 'rejected');
      if (allItems.length === 0) return null;

      const toggleCollapse = (id) => {
        setCollapsed(prev => ({ ...prev, [id]: !prev[id] }));
      };
      const isCollapsed = (id) => collapsed[id] === true;

      return (
        <div className="mt-5">
          <div className="flex items-center gap-2 mb-3">
            {unresolved.length > 0 && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse-slow"/>}
            <h3 className="text-sm font-semibold text-slate-700">
              客户协同通知栏
              {unresolved.length > 0 && <span className="text-slate-400 font-normal ml-1">— {unresolved.length} 条待处理</span>}
              <span className="text-slate-400 text-xs font-normal ml-2">共 {allItems.length} 条</span>
            </h3>
          </div>
          <div className="space-y-2">
            {allItems.map((n, i) => {
              const collapsedMode = isCollapsed(n.id);

              if (collapsedMode) {
                return (
                  <div
                    key={n.id}
                    onClick={() => toggleCollapse(n.id)}
                    className="flex items-center gap-3 px-4 py-2 rounded-lg cursor-pointer transition-all bg-slate-100 border border-slate-200 hover:bg-slate-100 hover:border-slate-200"
                  >
                    <span className="text-sm">{n.type === 'rework' ? '🔧' : '🔔'}</span>
                    <span className="text-xs text-slate-400 truncate flex-1">{n.title}</span>
                    {n.clientResponse === 'confirmed' && <span className="text-[10px] text-green-600 flex-shrink-0">✅ 已确认</span>}
                    {n.clientResponse === 'rejected' && <span className="text-[10px] text-red-600 flex-shrink-0">❌ 已驳回</span>}
                    {!n.clientResponse && <span className="text-[10px] text-amber-600 flex-shrink-0">⏸️ 已忽略</span>}
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2" className="flex-shrink-0"><path d="M18 15l-6-6-6 6"/></svg>
                  </div>
                );
              }

              return (
                <div
                  key={n.id}
                  className="rounded-xl p-4 border-l-4 animate-slide-up transition-all bg-white border border-slate-200 shadow-sm"
                  style={{
                    borderLeftColor: n.clientResponse === 'confirmed' ? '#10b981' : n.clientResponse === 'rejected' ? '#ef4444' : n.type === 'rework' ? '#f97316' : '#ef4444',
                    backgroundColor: n.clientResponse ? '#f8fafc' : '#ffffff',
                  }}
                >
                  <div className="flex items-start gap-3">
                    <span className="text-xl mt-0.5">{n.type === 'rework' ? '🔧' : '🔔'}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-bold text-slate-800">
                        {n.type === 'rework' ? '【关键返修提醒】' : '【关键风险提醒】'}{n.title}
                      </div>
                      <div className="mt-2 space-y-1 text-xs">
                        <div className="text-slate-400">* 原因：{n.reason}</div>
                        <div className="text-slate-400">* 影响：{n.impact}</div>
                        <div className="text-slate-400">* 预计恢复时间：{n.expectedRecovery}</div>
                        <div className="text-red-600 font-medium">
                          * 当前倒计时：<span className="text-lg font-bold">{n.currentCountdown}天</span>
                          {n.originalCountdown > n.currentCountdown && (
                            <span className="text-slate-400 ml-1">（原{n.originalCountdown}天）</span>
                          )}
                        </div>
                      </div>

                      {/* Action buttons — only show if still unresolved */}
                      {!n.clientResponse && (
                        <div className="flex items-center gap-2 mt-3">
                          <button
                            onClick={() => onConfirm(n.id)}
                            className="px-3 py-1.5 bg-green-50 hover:bg-green-100 border border-green-200 text-green-600 rounded-lg text-xs font-medium transition-all"
                          >
                            ✅ 一键确认延期
                          </button>
                          <button
                            onClick={() => onReject(n.id)}
                            className="px-3 py-1.5 bg-red-100 hover:bg-red-100 border border-red-300 text-red-600 rounded-lg text-xs font-medium transition-all"
                          >
                            ❌ 驳回并要求加急
                          </button>
                          <button
                            onClick={() => { onDismiss(n.id); toggleCollapse(n.id); }}
                            className="px-3 py-1.5 bg-slate-50 hover:bg-slate-200 text-slate-500 rounded-lg text-xs transition-all ml-auto"
                          >
                            稍后处理 ↕
                          </button>
                        </div>
                      )}
                      {n.clientResponse === 'confirmed' && (
                        <div className="mt-2 text-xs text-green-600">✅ 客户已确认延期通知</div>
                      )}
                      {n.clientResponse === 'rejected' && (
                        <div className="mt-2 text-xs text-red-600">❌ 客户已驳回并要求加急处理</div>
                      )}

                      {/* Expand/collapse toggle when resolved */}
                      {n.clientResponse && (
                        <button
                          onClick={() => toggleCollapse(n.id)}
                          className="mt-2 text-xs text-slate-400 hover:text-slate-600 transition-colors"
                        >
                          ↕ 收起
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {unresolved.length === 0 && (
            <div className="text-xs text-slate-400 mt-2">
              所有通知已处理。点击上方已折叠的记录可查看详情和重新操作。
            </div>
          )}
        </div>
      );
    };

    // --- Auto Status Checker Helper ---
    const runAutoTransition = (phases) => {
      let changed = false;
      const result = phases.map(phase => {
        const newNodes = phase.nodes.map(n => {
          if (n.status === 'pending' && n.planStart <= TODAY && !n.delay) {
            changed = true;
            return { ...n, status: 'ongoing' };
          }
          return n;
        });
        return { ...phase, nodes: newNodes };
      });
      return { phases: result, changed };
    };

    // =========================== MAIN APP ===========================
    const App = () => {
      const [state, dispatch] = useReducer(projectReducer, null, initState);
      const [selectedNode, setSelectedNode] = useState(null);
      const [delayModalNodeId, setDelayModalNodeId] = useState(null);
      const [reworkSourceNodeId, setReworkSourceNodeId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [gateReviewPhaseId, setGateReviewPhaseId] = useState(null);
      const [terminateModalOpen, setTerminateModalOpen] = useState(false);
      const [showAddProject, setShowAddProject] = useState(false);
      const [reworkHistoryOpen, setReworkHistoryOpen] = useState(false);
      const [addForm, setAddForm] = useState({ name: '', owner: '', startDate: dateStr(new Date()) });

      // Live countdown tick
      useEffect(() => {
        const interval = setInterval(() => dispatch({ type: actionTypes.TICK }), 60000);
        return () => clearInterval(interval);
      }, []);

      // Auto-save state to localStorage on every change
      useEffect(() => {
        try {
          const json = JSON.stringify(state);
          localStorage.setItem('x7-kanban-state', json);
          // Broadcast to other tabs (群协同：一窗操作，全窗同步)
          try { new BroadcastChannel('x7-kanban').postMessage({ type: 'SYNC', ts: Date.now() }); } catch(e) {}
        } catch (e) {
          try {
            const lean = { ...state, productImages: [], productFiles: [] };
            localStorage.setItem('x7-kanban-state', JSON.stringify(lean));
            console.warn('Storage 满，已清理图片/文件，核心数据保留');
          } catch (e2) { /* 无私有模式/完全不可写 */ }
        }
      }, [state]);

      // 跨标签页实时同步（一窗操作，其他窗户自动更新）
      useEffect(() => {
        const bc = new BroadcastChannel('x7-kanban');
        bc.onmessage = () => {
          try {
            const cached = localStorage.getItem('x7-kanban-state');
            if (cached) {
              const parsed = JSON.parse(cached, (key, val) => {
                const dateKeys = ['planStart', 'planEnd', 'actualEnd', 'expectedRecovery', 'passedAt'];
                if (dateKeys.includes(key) && typeof val === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(val)) return new Date(val);
                return val;
              });
              if (parsed && parsed.phases) dispatch({ type: 'FULL_SYNC', payload: parsed });
            }
          } catch(e) {}
        };
        return () => bc.close();
      }, []);

      // URL 参数自动执行（从企微卡片打开时自动操作）
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const act = params.get('act');
        if (!act) return;
        // 清除 URL 参数不让重复执行
        const clean = window.location.pathname + window.location.hash;
        window.history.replaceState({}, '', clean);

        const nid = params.get('nid');
        const reason = params.get('reason') || '';
        const recovery = params.get('recovery');
        const impact = parseInt(params.get('impact') || '3');
        const tpid = params.get('tpid');

        if (act === 'daily') { pushProgressReport(state); }
        else if (act === 'delay' && nid) {
          if (recovery) {
            dispatch({ type: actionTypes.MARK_DELAYED, nodeId: nid, reason, expectedRecovery: new Date(recovery), impactDays: impact });
            pushDelayAlert(state, nid, reason, new Date(recovery), impact);
          } else {
            setDelayModalNodeId({ id: nid, isFromCard: true, reason, recovery });
          }
        }
        else if (act === 'rework' && nid && tpid) {
          dispatch({ type: actionTypes.CREATE_REWORK, sourceNodeId: nid, targetPhaseId: tpid, reason });
          const d = getDownstreamNodes(nid, state.phases);
          pushReworkNotice(state, nid, tpid, `${nid}-V2`, d.slice(0,5), reason);
        }
        else if (act === 'complete' && nid) {
          dispatch({ type: actionTypes.MARK_COMPLETED, nodeId: nid });
          pushSimpleEvent(state, `✅ 节点已完成（通过群卡片操作）`);
        }
      }, []); // 仅页面加载时执行一次

      // Auto transition on mount (with delay for visual effect)
      useEffect(() => {
        const { phases: newPhases, changed } = runAutoTransition(state.phases);
        if (changed) {
          // We can't directly set state, but we can dispatch a custom action
          // Actually, let's handle auto-transition in the initial state and ignore dynamic since it's a demo
        }
      }, []);

      const handleNodeClick = useCallback((node) => {
        setSelectedNode(node);
        setSidebarOpen(true);
      }, []);

      const handleGateReview = useCallback((phaseId) => {
        setGateReviewPhaseId(phaseId);
      }, []);

      const handlePassGate = useCallback((phaseId) => {
        const phase = state.phases.find(p => p.id === phaseId);
        dispatch({ type: actionTypes.GATE_PASS, phaseId });
        pushSimpleEvent(state, `🚪 阶段门通过：**${phase?.name || phaseId}**，可进入下一阶段`);
      }, [state]);

      const handleTerminateProject = useCallback(() => {
        dispatch({ type: actionTypes.TERMINATE_PROJECT });
        setTerminateModalOpen(false);
        pushSimpleEvent(state, `🛑 项目「${state.projectName}」已被终止`);
      }, [state]);

      const handleMarkDelay = useCallback((nodeId) => {
        setDelayModalNodeId(nodeId);
      }, []);

      const handleUpdateDelay = useCallback((nodeId) => {
        setDelayModalNodeId({ id: nodeId, isUpdate: true });
      }, []);

      const handleMarkCompleted = useCallback((nodeId) => {
        const n = getNodeById(state.phases, nodeId);
        dispatch({ type: actionTypes.MARK_COMPLETED, nodeId });
        pushSimpleEvent(state, `✅「${n?.name || nodeId}」已标记为完成`);
      }, [state]);

      const handleDelaySubmit = useCallback((nodeId, reason, recoveryDate, impactDays) => {
        const n = getNodeById(state.phases, nodeId);
        const isUpdate = delayModalNodeId && typeof delayModalNodeId === 'object' && delayModalNodeId.isUpdate;
        if (isUpdate) {
          // 更新延期预估：保留旧值到 delayHistory，写入新的 delay
          const prev = n?.delay || {};
          dispatch({
            type: actionTypes.UPDATE_NODE_DELAY,
            nodeId,
            reason,
            expectedRecovery: recoveryDate,
            impactDays,
            fromReason: prev.reason,
          });
          pushSimpleEvent(state, `📅「${n?.name || nodeId}」延期预估已更新\n> 新原因：${reason}\n> 预计恢复：${fmtF(recoveryDate)}\n> 新影响：${impactDays} 天`);
        } else {
          dispatch({ type: actionTypes.MARK_DELAYED, nodeId, reason, expectedRecovery: recoveryDate, impactDays });
          pushDelayAlert(state, nodeId, reason, recoveryDate, impactDays);
        }
        setDelayModalNodeId(null);
      }, [state, delayModalNodeId]);

      const handleRework = useCallback((nodeId) => {
        setReworkSourceNodeId(nodeId);
      }, []);

      const handleReworkSubmit = useCallback((sourceNodeId, targetPhaseId, reason) => {
        const s = getNodeById(state.phases, sourceNodeId);
        const t = state.phases.find(p => p.id === targetPhaseId);
        dispatch({ type: actionTypes.CREATE_REWORK, sourceNodeId, targetPhaseId, reason });
        setReworkSourceNodeId(null);
        const downstream = getDownstreamNodes(sourceNodeId, state.phases);
        pushReworkNotice(state, sourceNodeId, targetPhaseId, `${s?.name || sourceNodeId}-V2`, downstream.slice(0, 5), reason);
      }, [state]);

      const { done, total } = countCompleted(state.phases);
      const progress = total > 0 ? Math.round((done / total) * 100) : 0;

      return (
        <div className="min-h-screen bg-slate-50">
          <div className="max-w-[1600px] mx-auto px-4 py-5">
            {/* Top Header */}
            <ProjectHeader state={state} dispatch={dispatch} onTerminate={() => setTerminateModalOpen(true)} onAddProject={() => setShowAddProject(true)} onSwitchProject={(name) => dispatch({ type: actionTypes.SWITCH_PROJECT, projectName: name })} onReworkHistory={() => setReworkHistoryOpen(true)} />
            </div>
            {/* Kanban Board */}
            <div className="flex gap-4 overflow-x-auto pb-4 kanban-scroll phase-wrapper">
              {state.phases.map(phase => (
                <PhaseColumn
                  key={phase.id}
                  phase={phase}
                  allPhases={state.phases}
                  phaseGates={state.phaseGates}
                  onGateReview={handleGateReview}
                  onNodeClick={handleNodeClick}
                  onMarkCompleted={handleMarkCompleted}
                />
              ))}
              {/* Product Image Column */}
              <ProductImageColumn
                images={state.productImages || []}
                onUpload={(newImages) => dispatch({ type: actionTypes.UPDATE_PRODUCT_IMAGES, productImages: newImages })}
                onRemove={(newImages) => dispatch({ type: actionTypes.UPDATE_PRODUCT_IMAGES, productImages: newImages })}
              />
              {/* Product Files Column */}
              <ProductFilesColumn
                files={state.productFiles || []}
                onAddFiles={(newFiles) => dispatch({ type: actionTypes.UPDATE_PRODUCT_FILES, productFiles: newFiles })}
                onRemoveFile={(id) => dispatch({ type: actionTypes.UPDATE_PRODUCT_FILES, productFiles: (state.productFiles || []).filter(f => f.id !== id) })}
              />
            </div>

            {/* Client Notification Panel */}
            <ClientNotificationPanel
              notifications={state.notifications}
              onDismiss={(id) => dispatch({ type: actionTypes.DISMISS_NOTIFICATION, notificationId: id })}
              onConfirm={(id) => dispatch({ type: actionTypes.CLIENT_CONFIRM, notificationId: id })}
              onReject={(id) => dispatch({ type: actionTypes.CLIENT_REJECT, notificationId: id })}
            />

            {/* (Summary Stats 已移至 ProjectHeader 左侧) */}

          {/* WeCom Push Toast (fixed top-right) */}
          <WecomToast logs={state.activityLog} />

          {/* Activity Log */}
          <div className="max-w-[1600px] mx-auto px-4 pb-5">
            <ActivityLogPanel logs={state.activityLog} />
          </div>

          {/* Sidebar Drawer */}
          {sidebarOpen && selectedNode && (
            <TaskDetailDrawer
              node={selectedNode}
              phaseName={state.phases.find(p => p.nodes.some(n => n.id === selectedNode.id))?.name || ''}
              onClose={() => { setSidebarOpen(false); setSelectedNode(null); }}
              onMarkDelay={handleMarkDelay}
              onUpdateDelay={handleUpdateDelay}
              onMarkCompleted={handleMarkCompleted}
              onRework={handleRework}
              onUpdateNotes={(nodeId, notes) => dispatch({ type: actionTypes.UPDATE_NODE_NOTES, nodeId, notes })}
              onUpdateStatus={(nodeId, status) => {
                dispatch({ type: actionTypes.UPDATE_NODE_STATUS, nodeId, status });
                const n = getNodeById(state.phases, nodeId);
                const statusLabels = { ongoing: '▶ 进行中', pending: '○ 待开始' };
                pushSimpleEvent(state, `🔄「${n?.name || nodeId}」状态变更 → ${statusLabels[status] || status}`);
              }}
            />
          )}

          {/* Delay Modal */}
          {delayModalNodeId && (
            <DelayModal
              nodeId={typeof delayModalNodeId === 'object' ? delayModalNodeId.id : delayModalNodeId}
              existingDelay={(typeof delayModalNodeId === 'object' && delayModalNodeId.isUpdate)
                ? (getNodeById(state.phases, delayModalNodeId.id)?.delay || undefined)
                : undefined}
              phases={state.phases}
              onClose={() => setDelayModalNodeId(null)}
              onSubmit={handleDelaySubmit}
            />
          )}

          {/* Rework Modal */}
          {reworkSourceNodeId && (
            <ReworkModal
              sourceNodeId={reworkSourceNodeId}
              phases={state.phases}
              onClose={() => setReworkSourceNodeId(null)}
              onSubmit={handleReworkSubmit}
            />
          )}

          {/* Gate Review Modal */}
          {gateReviewPhaseId && (
            <GateReviewModal
              phaseId={gateReviewPhaseId}
              phases={state.phases}
              phaseGates={state.phaseGates}
              onClose={() => setGateReviewPhaseId(null)}
              onPassGate={handlePassGate}
            />
          )}

          {/* Terminate Confirm Modal */}
          {terminateModalOpen && (
            <TerminateConfirmModal
              onClose={() => setTerminateModalOpen(false)}
              onConfirm={handleTerminateProject}
            />
          )}

          {/* Rework History Modal */}
          {reworkHistoryOpen && (
            <ReworkHistoryModal
              records={state.reworkRecords || []}
              phases={state.phases}
              onClose={() => setReworkHistoryOpen(false)}
            />
          )}

          {/* Add Project Modal */}
          {showAddProject && (
            <AddProjectModal
              onClose={() => setShowAddProject(false)}
              onSubmit={(form) => {
                dispatch({
                  type: actionTypes.ADD_PROJECT,
                  projectName: form.name,
                  owner: form.owner,
                  startDate: form.startDate,
                });
                setShowAddProject(false);
                setAddForm({ name: '', owner: '', startDate: dateStr(new Date()) });
              }}
            />
          )}
        </div>
      );
    };

    // =========================== RENDER ===========================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
