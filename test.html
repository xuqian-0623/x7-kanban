<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Test</title>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/babel.min.js"></script>
<style>body{background:#0f172a;color:white;font-family:sans-serif;padding:20px}</style>
</head><body>
<h1>Status Check</h1>
<div id="status">Loading...</div>
<div id="root"></div>
<script>
window.addEventListener('error', e => {
  document.getElementById('status').innerHTML = 'JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
});
</script>
<script type="text/babel">
try {
  document.getElementById('status').innerHTML = 'Babel ran! React=' + (typeof React) + ' ReactDOM=' + (typeof ReactDOM);
  const App = () => <div style={{padding:20,background:'#7c3aed',borderRadius:8}}>React 渲染成功 ✓</div>;
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
} catch(e) {
  document.getElementById('status').innerHTML = 'ERROR: ' + e.message;
}
</script>
</body></html>
